<app-list-page
  [pageTitle]="'PRICE_MANAGEMENT.TITLE' | translate"
  [breadcrumbs]="breadcrumbs"
  [columns]="columns"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="[]"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState"
  [entityType]="'price-management'"
  [mobileCardConfig]="mobileCardConfig"
  (rowClicked)="onRowClick($event)">

  <div listHeaderActions class="flex items-center gap-3">
    @if (canAdd) {
      <button type="button" (click)="add()"
        class="flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-lg font-medium whitespace-nowrap bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl transition-all">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>{{ 'PRICE_MANAGEMENT.NEW' | translate }}</span>
      </button>
    }
  </div>

  <ng-template listCellTemplate="title" let-row>
    <span class="font-medium text-slate-900 list-interactive-cell">{{ row.title }}</span>
  </ng-template>
  <ng-template listCellTemplate="fromDate" let-row>{{ row.fromDate | date: 'dd/MM/yyyy' }}</ng-template>
  <ng-template listCellTemplate="toDate" let-row>{{ row.toDate | date: 'dd/MM/yyyy' }}</ng-template>
  <ng-template listCellTemplate="repeat" let-row>{{ repeatLabel(row) }}</ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end gap-2" (click)="$event.stopPropagation()">
      @if (canAdd) {
        <button type="button" (click)="edit(row)"
          class="px-4 h-9 inline-flex items-center rounded-full bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
          {{ 'COMMON.EDIT' | translate }}
        </button>
      }
    </div>
  </ng-template>
</app-list-page>
