<app-modal-header
  [title]="(isEdit()
    ? 'EMPLOYEES.SCHEDULE.EDIT_SHIFT_TITLE'
    : 'EMPLOYEES.SCHEDULE.ADD_SHIFT_TITLE') | translate" />

<div class="body">
  <!-- Team member -->
  <div class="section">
    <label class="lbl">{{ 'EMPLOYEES.SCHEDULE.TEAM_MEMBER' | translate }}</label>
    <div class="member">
      <span class="avatar">
        @if (employee.avatar) {
          <img [src]="employee.avatar" [alt]="employee.employeeName" />
        } @else {
          {{ employee.employeeName.charAt(0).toUpperCase() }}
        }
      </span>
      <span class="member-name">{{ employee.employeeName }}</span>
    </div>
  </div>

  <!-- Date -->
  <div class="section">
    <label class="lbl">{{ 'EMPLOYEES.SCHEDULE.DATE' | translate }}</label>
    <div class="date-readonly">{{ date | date: 'MMM d, y' }}</div>
  </div>

  <!-- Shift rows (shared editor) -->
  <app-day-shifts-editor [shifts]="dayShifts" (stateChange)="state.set($event)" />
</div>

<app-modal-footer>
  <button type="button" class="btn-cancel" (click)="cancel()">
    {{ 'COMMON.CANCEL' | translate }}
  </button>
  <button type="button" class="btn-save" [disabled]="!canSave()" (click)="save()">
    {{ 'COMMON.SAVE' | translate }}
  </button>
</app-modal-footer>
