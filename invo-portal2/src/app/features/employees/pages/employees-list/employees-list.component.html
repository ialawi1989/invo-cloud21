<app-list-page
  [pageTitle]="'EMPLOYEES.TITLE' | translate"
  [pageSubtitle]="'EMPLOYEES.SUBTITLE' | translate"
  [columns]="columns"
  [dataSource]="loadEmployees"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="[]"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState"
  [entityType]="'employee'"
  (rowClicked)="onRowClick($event)">

  <div listHeaderActions class="flex items-center gap-2">
    @if (canInvite) {
      <button type="button" (click)="invite()"
        class="px-4 py-2.5 rounded-lg font-medium whitespace-nowrap border border-slate-200 text-brand-600 hover:bg-brand-50 transition-colors">
        {{ 'EMPLOYEES.INVITE_EMPLOYEE' | translate }}
      </button>
    }
    @if (canAdd) {
      <button type="button" (click)="add()"
        class="flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-lg font-medium whitespace-nowrap bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span>{{ 'EMPLOYEES.ADD_NEW' | translate }}</span>
      </button>
    }
  </div>

  <ng-template listCellTemplate="name" let-row>
    <span class="inline-flex items-center gap-2.5 min-w-0">
      @if (row.avatar) {
        <img [src]="row.avatar" alt="" class="w-8 h-8 rounded-full object-cover flex-shrink-0" />
      } @else {
        <span class="w-8 h-8 rounded-full inline-flex items-center justify-center bg-brand-50 text-brand-600 text-sm font-semibold flex-shrink-0">
          {{ initial(row.name) }}
        </span>
      }
      <span class="font-medium text-slate-900 break-words list-interactive-cell">{{ row.name || '—' }}</span>
      @if (row.isInvitedUser) {
        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold uppercase bg-amber-100 text-amber-800 whitespace-nowrap">
          {{ 'EMPLOYEES.INVITE_EMPLOYEE' | translate }}
        </span>
      }
    </span>
  </ng-template>

  <ng-template listCellTemplate="superAdmin" let-row>
    @if (row.superAdmin) { <span class="check">✓</span> } @else { <span class="text-slate-300">—</span> }
  </ng-template>
  <ng-template listCellTemplate="admin" let-row>
    @if (row.admin) { <span class="check">✓</span> } @else { <span class="text-slate-300">—</span> }
  </ng-template>
  <ng-template listCellTemplate="user" let-row>
    @if (row.user) { <span class="check">✓</span> } @else { <span class="text-slate-300">—</span> }
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end" (click)="$event.stopPropagation()">
      <button type="button" (click)="edit(row)"
        class="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity
               px-4 h-9 inline-flex items-center rounded-full
               bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
        {{ 'COMMON.EDIT' | translate }}
      </button>
    </div>
  </ng-template>

</app-list-page>
