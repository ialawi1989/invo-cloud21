<app-list-shell
  [title]="'EMPLOYEES.PRIVILEGES.TITLE' | translate"
  [subtitle]="'EMPLOYEES.PRIVILEGES.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [search]="search()"
  [searchPlaceholder]="'EMPLOYEES.PRIVILEGES.SEARCH_PLACEHOLDER' | translate"
  [page]="page()"
  [pageCount]="pageCount()"
  [total]="total()"
  [rangeLabel]="rangeLabel()"
  [loading]="loading()"
  [hasRows]="rows().length > 0"
  [cardFlush]="true"
  (searchChange)="onSearch($event)"
  (searchClear)="clearSearch()"
  (prevPage)="goPrev()"
  (nextPage)="goNext()">

  <div shellActions class="actions">
    @if (canAdd) {
      <button type="button" class="btn btn--primary" (click)="add()">
        {{ 'EMPLOYEES.PRIVILEGES.ADD_NEW' | translate }}
      </button>
    }
  </div>

  <div shellEmpty>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <p>{{ (search() ? 'EMPLOYEES.PRIVILEGES.NO_MATCH' : 'EMPLOYEES.PRIVILEGES.EMPTY') | translate }}</p>
  </div>

  <table class="table" role="grid">
    <thead>
      <tr>
        <th class="table__name">{{ 'EMPLOYEES.PRIVILEGES.NAME' | translate }}</th>
        <th class="table__actions"></th>
      </tr>
    </thead>
    <tbody>
      @for (p of rows(); track p.id) {
        <tr (click)="edit(p)">
          <td class="table__name">
            <span class="row-name">{{ p.name || '—' }}</span>
          </td>
          <td class="table__actions">
            <button
              type="button"
              class="icon-btn"
              (click)="$event.stopPropagation(); edit(p)"
              [attr.aria-label]="'COMMON.EDIT' | translate"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
              </svg>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-list-shell>
