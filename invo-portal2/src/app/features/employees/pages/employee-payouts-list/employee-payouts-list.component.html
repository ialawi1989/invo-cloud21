<app-list-page
  [pageTitle]="'MENU.SUB.EMPLOYEE_PAYOUTS' | translate"
  [breadcrumbs]="breadcrumbs"
  [columns]="columns"
  [dataSource]="loadPayouts"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="filters"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState"
  [entityType]="'employeePayout'"
  (rowClicked)="onRowClick($event)">

  <div listHeaderActions class="flex items-center gap-3">
    @if (canAdd) {
      <button type="button" (click)="add()"
        class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        {{ 'EMPLOYEE_PAYOUT.NEW' | translate }}
      </button>
    }
  </div>

  <ng-template listCellTemplate="paymentDate" let-row>
    <span class="font-semibold text-brand-700">{{ row.paymentDate | date: 'yyyy-MM-dd' }}</span>
  </ng-template>
  <ng-template listCellTemplate="amount" let-row>
    <span class="tabular-nums">{{ row.amount | mycurrency }}</span>
  </ng-template>
</app-list-page>
