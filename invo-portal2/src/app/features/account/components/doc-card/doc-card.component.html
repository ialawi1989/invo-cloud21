@let a = adapter();
@let st = status();

@if (compact()) {
  <button type="button" (click)="view()"
    class="w-full text-start rounded-lg border border-slate-200 bg-white px-2.5 py-2 shadow-sm hover:border-brand-300 hover:shadow transition">
    <div class="flex items-center justify-between gap-2">
      <span class="truncate text-xs font-semibold text-brand-700">{{ number() }}</span>
      <span class="text-[11px] tabular-nums font-semibold text-slate-700">{{ row().total | mycurrency }}</span>
    </div>
    <div class="mt-0.5 flex items-center justify-between gap-2">
      <span class="truncate text-[11px] text-slate-500">{{ party() || '—' }}</span>
      @if (st) {
        <span class="shrink-0 text-[10px] font-medium px-1.5 py-0.5 rounded-full" [ngClass]="a.statusClass(st)">
          {{ a.statusLabel(st) }}
        </span>
      }
    </div>
  </button>
} @else {
  <div class="rounded-xl border border-slate-200 bg-white shadow-sm hover:shadow-md transition">
    <button type="button" (click)="view()" class="block w-full text-start p-3">
      <div class="flex items-start justify-between gap-2">
        <span class="font-semibold text-brand-700 break-all">{{ number() }}</span>
        <span class="tabular-nums font-semibold text-slate-800 whitespace-nowrap">{{ row().total | mycurrency }}</span>
      </div>
      @if (ref()) {
        <div class="text-xs text-slate-500 truncate">{{ ref() }}</div>
      }
      <div class="mt-0.5 text-sm text-slate-600 truncate">{{ party() || '—' }}</div>
      <div class="mt-2 flex flex-wrap items-center gap-1.5">
        @if (st) {
          <span class="text-xs font-medium px-2 py-0.5 rounded-full" [ngClass]="a.statusClass(st)">{{ a.statusLabel(st) }}</span>
        }
        @for (c of chips(); track c.text) {
          <span class="text-xs font-medium px-2 py-0.5 rounded-full" [ngClass]="c.classes">{{ c.text }}</span>
        }
        @if (row().branchName) {
          <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">{{ row().branchName }}</span>
        }
      </div>
      <div class="mt-2 flex items-center justify-between gap-2 text-xs text-slate-500">
        <span>{{ date() | date: 'yyyy-MM-dd' }}</span>
        @if (due()) {
          <span [class.text-red-600]="overdue()" [class.font-medium]="overdue()">
            @if (a.dueLabelKey) { {{ a.dueLabelKey | translate }}: }{{ due() | date: 'yyyy-MM-dd' }}
          </span>
        }
      </div>
    </button>

    <div class="flex items-center justify-end gap-2 border-t border-slate-100 px-3 py-2">
      @if (canEdit()) {
        <button type="button" (click)="edit()"
          class="px-3 h-8 inline-flex items-center rounded-full bg-brand-600 text-white text-xs font-medium hover:bg-brand-700">
          {{ 'COMMON.EDIT' | translate }}
        </button>
      } @else if (blockedReason(); as why) {
        <!-- Greyed Edit with the reason on hover (aria-disabled keeps hover events). -->
        <button type="button" aria-disabled="true"
          [appTooltip]="why | translate" [attr.aria-label]="('COMMON.EDIT' | translate) + ': ' + (why | translate)"
          class="px-3 h-8 inline-flex items-center gap-1 rounded-full bg-slate-100 text-slate-400 text-xs font-medium cursor-not-allowed">
          <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          {{ 'COMMON.EDIT' | translate }}
        </button>
      }
      @if (menu(); as items) {
        @if (items.length) {
          <app-dropdown-menu-btn [items]="items" [appendToBody]="true" [chevron]="false" align="end"
            triggerClass="inline-flex items-center justify-center w-8 h-8 rounded-full border border-slate-200 bg-white text-slate-600 hover:bg-slate-50">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
          </app-dropdown-menu-btn>
        }
      }
    </div>
  </div>
}
