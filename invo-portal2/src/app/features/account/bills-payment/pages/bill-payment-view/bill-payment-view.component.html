@if (doc(); as p) {
  <app-doc-view-shell
    [docTitle]="title" railTitle="BILLS_PAYMENT.LIST.PAYMENTS_LIST" [showAdd]="actions.canAdd"
    [railItems]="railItems()" [railLoading]="railLoading()" [railTerm]="railTerm()" [railPage]="railPage()" [railPageCount]="railPageCount()" [selectedId]="id"
    [printItems]="actions.canPrint ? printItems() : []" [shareItems]="shareItems()" [exportItems]="exportItems()" [actionItems]="actionItems(p)"
    [showEdit]="actions.canEdit(p)" [showPaper]="false"
    [loading]="loading()" [template]="template()" [data]="renderData()"
    [zoom]="zoom()" (zoomChange)="setZoom($event)"
    (railSearch)="onRailSearch($event)" (railPick)="railGoTo($event)" (railPrev)="railPrev()" (railNext)="railNext()" (add)="add()"
    (close)="goToList()" (edit)="edit()">
    <app-party-peek-chips beforePaper [supplierId]="p.supplierId" [supplierName]="p.supplierName"/>

    <div alt class="bpv-viewer">
      <div class="bpv-sheet">
        <app-bill-payment-receipt [payment]="p"/>
      </div>
    </div>

    <div tabs id="bill-payment-additional-details">
      <app-doc-additional-details [config]="additionalDetails()"/>
    </div>
  </app-doc-view-shell>
} @else {
  <app-doc-view-skeleton/>
}
