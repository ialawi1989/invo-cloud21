@if (doc && editor) {
  @let d = bill;
  <app-doc-form-shell
    [title]="'RECURRING_BILLS.FORM.RECURRING_BILL' | translate" [breadcrumbs]="breadcrumbs"
    [canDraft]="false" [submitting]="submitting" [saveDisabled]="missing.length > 0" [showView]="formStatus === 'edit'"
    [saveLabel]="saveLabelKey | translate" [actionsMenu]="actionsMenu()"
    [total]="d.total" [totalQty]="totalQuantity"
    (save)="savePrimary()" (cancel)="cancel()" (view)="view()">

    <app-recurring-schedule-card [rec]="rec" root="RECURRING_BILLS" [isNew]="formStatus !== 'edit'" [showErrors]="showErrors" (changed)="markDirty()"/>

    <app-doc-supplier-section
      [supplier]="supplierValue" [error]="fieldError('supplierId')" [international]="d.allowBillOfEntry" [locked]="frozen"
      (supplierChange)="onSupplier($event)" (createNew)="createSupplier()"/>

    <section class="df-card">
      <h2 class="df-card__title"><span class="df-ico df-ico--green" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span>{{ 'RECURRING_BILLS.FORM.BILL_DETAILS' | translate }}</h2>

      <div class="df-row">
        <div class="df-field df-field--grow">
          <label>{{ 'DOC_FORM.BRANCH' | translate }} <span class="req">*</span></label>
          <app-search-dropdown [items]="branches" [displayWith]="branchLabel" [compareWith]="byId"
            [value]="branchOf()" (valueChange)="onBranch($any($event))" [clearable]="false" [disabled]="branchLocked"
            [placeholder]="'DOC_FORM.SELECT_BRANCH' | translate"/>
          @if (fieldError('branchId'); as err) { <p class="df-error">{{ err }}</p> }
        </div>
        <div class="df-field df-field--grow">
          <label>{{ 'RECURRING_BILLS.FORM.TERM' | translate }}</label>
          <app-search-dropdown [items]="terms" [displayWith]="termLabel" [compareWith]="sameValue" [searchable]="false"
            [value]="termOf()" (valueChange)="onTerm($any($event)?.value)" [clearable]="false"/>
        </div>
        <div class="df-field df-field--grow">
          <label>{{ 'DOC_FORM.TAX_TYPE' | translate }}</label>
          <app-segmented-toggle [options]="taxTypes" [value]="taxType" (valueChange)="onTaxType($event)"/>
        </div>
      </div>
      @if (frozen) { <p class="df-hint">{{ 'RECURRING_BILLS.FORM.LOCKED_HINT' | translate }}</p> }

      <button type="button" class="df-link rf-advanced" (click)="advancedOpen = !advancedOpen">
        {{ 'RECURRING_BILLS.FORM.ADVANCED' | translate }} {{ advancedOpen ? '▴' : '▾' }}
      </button>
      @if (advancedOpen) {
        <div class="df-row">
          <div class="df-field df-field--grow">
            <label>{{ 'RECURRING_BILLS.FORM.PAYABLE_ACCOUNT' | translate }}</label>
            <app-search-dropdown [items]="payableAccounts" [displayWith]="accountLabel" [compareWith]="byId"
              [value]="payableOf()" (valueChange)="onPayable($any($event))" [clearable]="true"
              [placeholder]="'RECURRING_BILLS.FORM.SELECT_ACCOUNT' | translate"/>
          </div>
        </div>
      }
    </section>

    <app-doc-lines-table
      [doc]="d" [editor]="editor!" [config]="linesConfig" [formStatus]="formStatus"
      (changed)="markDirty()">
      <app-bill-totals [bill]="d" (changed)="markDirty()"/>
    </app-doc-lines-table>
  </app-doc-form-shell>
}
