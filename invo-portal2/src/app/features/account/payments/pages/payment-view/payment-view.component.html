@if (doc(); as p) {
  <app-doc-view-shell
    [docTitle]="title" railTitle="PAYMENTS.LIST.PAYMENTS_LIST" [showAdd]="actions.canAddPrivilege"
    [railItems]="railItems()" [railLoading]="railLoading()" [railTerm]="railTerm()" [railPage]="railPage()" [railPageCount]="railPageCount()" [selectedId]="id"
    [railFilterOptions]="railFilterOptions()" [railFilterValue]="railStatus()" railFilterStorageKey="paymentStatus"
    [printItems]="actions.canPrint ? printItems() : []" [shareItems]="shareItems()" [exportItems]="exportItems()" [actionItems]="actionItems(p)"
    [showEdit]="actions.canEdit(p)" [showPaper]="false"
    [loading]="loading()" [template]="template()" [data]="renderData()"
    [zoom]="zoom()" (zoomChange)="setZoom($event)"
    (railSearch)="onRailSearch($event)" (railPick)="railGoTo($event)" (railFilterPick)="onRailFilterPick($event)" (railPrev)="railPrev()" (railNext)="railNext()" (add)="add()"
    (close)="goToList()" (edit)="edit()">
    <app-party-peek-chips beforePaper [customerId]="p.customerId" [customerName]="p.customerName"/>

    <app-doc-view-attachments beforePaper type="invoicePayment" [docId]="id" [attachments]="p.attachment"/>

    <div alt class="pvw-viewer">
      <div class="pvw-sheet">
        <app-payment-receipt class="pr-flat" [payment]="p"/>
      </div>
    </div>

    <div tabs id="payment-additional-details">
      <app-doc-additional-details [config]="additionalDetails()"/>
    </div>
  </app-doc-view-shell>
} @else {
  <app-doc-view-skeleton/>
}
