<div class="sfp">
  <app-page-header [title]="'SUPPLIERS.TEXT' | translate" [trail]="breadcrumbs">
@if (supplierForm) {
<app-form-actions pageActions>
        <button formActionSecondary type="button" (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
        <button formActionPrimary type="button" [disabled]="!canSave || saving" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button>
</app-form-actions>
}
</app-page-header>

  @if (supplierForm) {
    <form [formGroup]="supplierForm" (ngSubmit)="save()" (keydown.enter)="$event.preventDefault()">
      <app-supplier-form-details [supplierData]="supplierData" [supplierForm]="supplierForm" [formStatus]="formStatus"/>

      
    </form>
  }
</div>
