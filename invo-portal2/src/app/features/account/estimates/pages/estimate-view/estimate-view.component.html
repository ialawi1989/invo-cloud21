@if (doc(); as e) {
  <app-doc-view-shell
    [docTitle]="title" railTitle="ESTIMATES.LIST.ESTIMATES_LIST" [showAdd]="actions.canAdd"
    [railItems]="railItems()" [railBulkActions]="railBulkActions()" [railFilterOptions]="railFilterOptions()" [railFilterValue]="railStatus()" railFilterStorageKey="estimateStatus" [railMoreItems]="railMoreItems()" [railLoading]="railLoading()" [railTerm]="railTerm()" [railPage]="railPage()" [railPageCount]="railPageCount()" [selectedId]="id"
    [printItems]="actions.canPrint ? printItems() : []" [shareItems]="shareItems()" [exportItems]="exportItems()" [actionItems]="actionItems(e)"
    [showEdit]="actions.edit(e)"
    [loading]="loading()" [template]="template()" [data]="renderData()" [reportDesign]="reportDesign()" [reportData]="reportData()"
    [zoom]="zoom()" (zoomChange)="setZoom($event)" [viewerTools]="true"
    (railSearch)="onRailSearch($event)" (railPick)="railGoTo($event)" (railFilterPick)="onRailFilterPick($event)" (railPrev)="railPrev()" (railNext)="railNext()" (add)="add()"
    (close)="goToList()" (edit)="edit()">
    <app-party-peek-chips beforePaper [customerId]="e.customerId" [customerName]="e.customerName"/>

    @if (e.invoiceId) {
      <div banner class="dv-banner dv-banner--info">
        {{ 'ESTIMATES.VIEW.CONVERTED_TO' | translate }}
        <a href="javascript:void(0)" (click)="goToInvoice(e.invoiceId)">#{{ e.invoiceNumber }}</a>
      </div>
    }
  </app-doc-view-shell>
} @else {
  <app-doc-view-skeleton/>
}
