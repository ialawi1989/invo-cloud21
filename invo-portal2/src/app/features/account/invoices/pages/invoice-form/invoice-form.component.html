@if (doc && editor) {
  @let inv = doc;
  <app-doc-form-shell
    [title]="'INVOICES.FORM.INVOICE' | translate" [breadcrumbs]="breadcrumbs"
    [canDraft]="canOfferDraft" [submitting]="submitting" [saveDisabled]="missing.length > 0" [draftDisabled]="missingDraft.length > 0" [showView]="formStatus === 'edit'"
    [saveLabel]="saveLabelKey | translate" [saveMenu]="saveMenu()" [actionsMenu]="actionsMenu()"
    [total]="inv.total" [totalQty]="totalQuantity"
    (draft)="saveDraft()" (save)="savePrimary()" (cancel)="cancel()" (view)="view()">

    <div class="df-top">
    <!-- Customer -->
    <app-doc-party-section
      [customer]="customerValue" [addresses]="addresses" [address]="customerAddress" [addressRequired]="isDelivery"
      [error]="fieldError('customerId')"
      (customerChange)="onCustomer($event)" (addressChange)="setAddress($event)" (addAddress)="addAddress()"
      (createNew)="createCustomer()" (advancedSearch)="advancedCustomerSearch()"/>
    <!-- Attachments -->
    <app-doc-attachments-card [attachments]="inv.attachment" (changed)="onAttachments($event)"/>
    </div>

    <!-- Invoice details -->
    <section class="df-card">
      <h2 class="df-card__title"><span class="df-ico df-ico--green" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg></span>{{ 'INVOICES.FORM.INVOICE_DETAILS' | translate }}</h2>

      <div class="df-row">
        <div class="df-field df-field--grow">
          <label for="invoiceNumber">{{ 'INVOICES.LIST.INVOICE_NUMBER' | translate }} <span class="req">*</span></label>
          <div class="df-num" [class.is-invalid]="fieldError('invoiceNumber')">
            <input id="invoiceNumber" type="text" [(ngModel)]="inv.invoiceNumber" (ngModelChange)="markDirty()"/>
            <button type="button" class="df-gear" (click)="openNumberPrefs()" [attr.title]="'INVOICES.FORM.INVOICE_NUMBER_HELP' | translate" aria-label="settings">⚙</button>
          </div>
          @if (fieldError('invoiceNumber'); as e) { <p class="df-error">{{ e }}</p> }
        </div>
        <div class="df-field df-field--grow">
          <label for="refrenceNumber">{{ 'INVOICES.FORM.ORDER_NUMBER' | translate }}</label>
          <input id="refrenceNumber" class="df-input" type="text" [(ngModel)]="inv.refrenceNumber" (ngModelChange)="markDirty()"/>
        </div>
      </div>

      <div class="df-row">
        <div class="df-field df-field--grow">
          <label>{{ 'INVOICES.FORM.INVOICE_DATE' | translate }} <span class="req">*</span></label>
          <app-date-picker [value]="invoiceDate" [min]="minDate" [disabled]="dateLocked" (valueChange)="onInvoiceDate($event)"/>
        </div>
        <div class="df-field df-field--grow">
          <label>{{ 'INVOICES.FORM.TERM' | translate }}</label>
          <app-search-dropdown [items]="terms" [displayWith]="termLabel" [compareWith]="byValue" [searchable]="false"
            [value]="termOf()" (valueChange)="onTermPick($any($event))" [clearable]="false"/>
        </div>
        <div class="df-field df-field--grow">
          <label>{{ 'INVOICES.FORM.DUE_DATE' | translate }} <span class="req">*</span></label>
          <app-date-picker [value]="dueDate" [min]="invoiceDate" (valueChange)="onDueDate($event)"/>
        </div>
      </div>
      @if (helperKey) { <p class="df-hint">{{ helperKey | translate: helperParams }}</p> }

      <div class="df-row">
        <div class="df-field df-field--grow">
          <label>{{ 'DOC_FORM.BRANCH' | translate }} <span class="req">*</span></label>
          <app-search-dropdown [items]="branches" [displayWith]="branchLabel" [compareWith]="byId"
            [value]="branchOf()" (valueChange)="onBranch($any($event))" [clearable]="false" [disabled]="branchLocked"
            [placeholder]="'DOC_FORM.SELECT_BRANCH' | translate"/>
          @if (fieldError('branchId'); as e) { <p class="df-error">{{ e }}</p> }
        </div>
        <div class="df-field df-field--grow">
          <label>{{ 'DOC_FORM.SALESPERSON' | translate }}</label>
          <app-search-dropdown [loadFn]="loadEmployees" [pageSize]="20" [displayWith]="branchLabel" [compareWith]="byId"
            [value]="employeeValue" (valueChange)="onEmployee($any($event))" [clearable]="true"
            [placeholder]="'DOC_FORM.SELECT_SALESPERSON' | translate">
            <ng-template #footer>
              <button type="button" class="df-manage" (mousedown)="$event.preventDefault()" (click)="manageSalespersons()">
                ⚙ {{ 'DOC_SALES.MANAGE' | translate }}
              </button>
            </ng-template>
          </app-search-dropdown>
        </div>
      </div>

      <app-entity-custom-fields entityType="invoice" [parentForm]="form" [valueSource]="inv.customFields" idPrefix="cf-inv" [bare]="true"/>
    </section>

    <!-- Items + totals -->
    <app-doc-lines-table
      [doc]="inv" [editor]="editor!" [config]="linesConfig" [formStatus]="formStatus"
      (changed)="markDirty()">
      <app-doc-totals [doc]="inv" [editor]="editor!" [surcharges]="surcharges" notesHintKey="INVOICES.FORM.NOTES_HINT" (changed)="markDirty()"/>
    </app-doc-lines-table>

    @if (formStatus === 'edit') {
      <button footerExtra type="button" class="df-link" (click)="makeRecurring()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        {{ 'INVOICES.FORM.MAKE_RECURRING' | translate }}
      </button>
    }
  </app-doc-form-shell>
}
