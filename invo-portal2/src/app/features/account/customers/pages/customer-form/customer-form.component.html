<div class="cfp">
  <app-page-header [title]="'CUSTOMERS.TEXT' | translate" [trail]="breadcrumbs">
@if (customerForm) {
<app-form-actions pageActions>
        <button formActionSecondary type="button" (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
        <button formActionPrimary type="button" [disabled]="!canSave || saving" (click)="save()">{{ 'COMMON.SAVE' | translate }}</button>
</app-form-actions>
}
</app-page-header>

  @if (customerForm) {
    <form [formGroup]="customerForm" (ngSubmit)="save()" (keydown.enter)="$event.preventDefault()">
      <app-customer-form-details [customerData]="customerData" [customerForm]="customerForm" [formStatus]="formStatus"/>

      
    </form>
  }
</div>
