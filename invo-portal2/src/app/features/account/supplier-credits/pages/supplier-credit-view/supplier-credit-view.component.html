@if (doc(); as c) {
  <app-doc-view-shell
    [docTitle]="title" railTitle="SUPPLIER_CREDITS.LIST.CREDITS_LIST" [showAdd]="actions.canAdd"
    [railItems]="railItems()" [railLoading]="railLoading()" [railTerm]="railTerm()" [railPage]="railPage()" [railPageCount]="railPageCount()" [selectedId]="id"
    [printItems]="actions.canPrint ? printItems() : []" [shareItems]="shareItems()" [exportItems]="exportItems()" [actionItems]="actionItems(c)"
    [showEdit]="actions.edit(c)"
    [loading]="loading()" [template]="template()" [data]="renderData()" [reportDesign]="reportDesign()" [reportData]="reportData()"
    [zoom]="zoom()" (zoomChange)="setZoom($event)" [viewerTools]="true"
    (railSearch)="onRailSearch($event)" (railPick)="railGoTo($event)" (railPrev)="railPrev()" (railNext)="railNext()" (add)="add()"
    (close)="goToList()" (edit)="edit()">
    <app-party-peek-chips beforePaper [supplierId]="c.supplierId" [supplierName]="c.supplierName"/>

    <app-doc-view-attachments beforePaper type="supplierCredit" [docId]="id" [attachments]="c.attachment"/>

    <div tabs id="supplier-credit-additional-details">
      <app-doc-additional-details [config]="additionalDetails()"/>
    </div>
  </app-doc-view-shell>
}
