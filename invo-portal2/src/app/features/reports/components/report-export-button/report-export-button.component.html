<div class="re">
  <button type="button" class="re-btn" [class.loading]="!!busy()" [disabled]="!!busy()"
          aria-haspopup="menu" [attr.aria-expanded]="open()" (click)="toggle()">
    @if (busy()) {
      <svg class="re-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.2-8.55"/></svg>
    } @else {
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    }
    <span class="re-label">{{ 'REPORTS.EXPORT.LABEL' | translate }}</span>
    <svg class="re-chev" [class.open]="open()" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  @if (open()) {
    <div class="re-backdrop" (click)="close()"></div>
    <div class="re-menu" role="menu">
      <div class="re-head">{{ 'REPORTS.EXPORT.CHOOSE_FORMAT' | translate }}</div>

      @for (f of formats(); track f) {
        <button type="button" role="menuitem" class="re-item" (click)="pick(f)">
          <span class="re-ico" [class]="'re-ico re-ico-' + f">
            @switch (f) {
              @case ('pdf') {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              }
              @case ('xlsx') {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
              }
              @default {
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
              }
            }
          </span>
          <span class="re-info">
            <span class="re-title">{{ 'REPORTS.EXPORT.' + f.toUpperCase() | translate }}</span>
            <span class="re-desc">{{ 'REPORTS.EXPORT.' + f.toUpperCase() + '_DESC' | translate }}</span>
          </span>
        </button>
      }

      @if (printable()) {
        <div class="re-sep"></div>
        <button type="button" role="menuitem" class="re-item" (click)="doPrint()">
          <span class="re-ico re-ico-print">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          </span>
          <span class="re-info">
            <span class="re-title">{{ 'REPORTS.EXPORT.PRINT' | translate }}</span>
            <span class="re-desc">{{ 'REPORTS.EXPORT.PRINT_DESC' | translate }}</span>
          </span>
        </button>
      }
    </div>
  }
</div>
