<div class="sheet-tabs" (click)="closeContextMenu()">
  @for (s of sheets; track s) {
    <div
      class="sheet-tab"
      [class.is-active]="s.id === activeSheetId"
      (click)="onSelectSheet(s.id)"
      (contextmenu)="showContextMenu(s.id, $event)"
    >
      @if (editingId !== s.id) {
        <span class="tab-name">{{ s.name }}</span>
      }
      @if (editingId === s.id) {
        <input
          class="tab-rename-input"
          [(ngModel)]="editingName"
          (blur)="finishRename()"
          (keydown)="onRenameKeydown($event)"
          (click)="$event.stopPropagation()"
          autofocus
        />
      }
      @if (contextMenuId === s.id) {
        <div class="tab-context-menu" (click)="$event.stopPropagation()">
          <button (click)="startRename(s, $event)">
            {{ 'CUSTOM_REPORTS.SHEETS.RENAME' | translate }}
          </button>
          @if (sheets.length > 1) {
            <button class="danger" (click)="onRemoveSheet(s.id)">
              {{ 'CUSTOM_REPORTS.SHEETS.DELETE' | translate }}
            </button>
          }
        </div>
      }
    </div>
  }

  @if (canEdit) {
    <button
      class="add-tab-btn"
      (click)="onAddSheet()"
      [title]="'CUSTOM_REPORTS.SHEETS.ADD_SHEET' | translate"
    >
      <svg
        width="13"
        height="13"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 5v14M5 12h14" />
      </svg>
      <span>{{ 'CUSTOM_REPORTS.SHEETS.ADD_SHEET' | translate }}</span>
    </button>
  }

  <span class="tabs-spacer"></span>

  <!-- <a class="dashboard-link" title="Dashboard">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z"/>
    </svg>
    Dashboard
  </a> -->
</div>
