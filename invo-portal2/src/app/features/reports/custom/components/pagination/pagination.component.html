<div class="pagination-bar" *ngIf="totalRows > 0">
  <div class="page-info">
    <span class="rows-label">{{ startRow }}–{{ endRow }}</span>
  </div>

  <div class="page-size-wrap">
    <label class="page-size-label">Rows:</label>
    <ng-select appendTo="body" panelClass="cr-ng-select-dropdown"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
      class="page-size-select"
      [clearable]="false"
    >
      <ng-option *ngFor="let s of pageSizes" [value]="s">{{ s }}</ng-option>
    </ng-select>
  </div>

  <div class="page-controls">
    <button
      class="page-btn"
      [disabled]="currentPage <= 1"
      (click)="goToPage(1)"
      title="First"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>
    </button>
    <button
      class="page-btn"
      [disabled]="currentPage <= 1"
      (click)="goToPage(currentPage - 1)"
      title="Previous"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <button
      *ngFor="let p of visiblePages"
      class="page-btn page-num"
      [class.active]="p === currentPage"
      (click)="goToPage(p)"
    >
      {{ p }}
    </button>

    <button
      class="page-btn"
      [disabled]="currentPage >= totalPages"
      (click)="goToPage(currentPage + 1)"
      title="Next"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button
      class="page-btn"
      [disabled]="currentPage >= totalPages"
      (click)="goToPage(totalPages)"
      title="Last"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>
    </button>
  </div>
</div>
