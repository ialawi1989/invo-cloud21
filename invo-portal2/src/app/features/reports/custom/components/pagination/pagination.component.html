@if (rowCount > 0 || currentPage > 1) {
  <div class="pagination-bar">
    <div class="page-info">
      <span class="rows-label">{{ startRow }}–{{ endRow }}</span>
    </div>
    <div class="page-size-wrap">
      <label class="page-size-label">{{ 'CUSTOM_REPORTS.PAGINATION.ROWS' | translate }}</label>
      <ng-select
        appendTo="body"
        panelClass="cr-ng-select-dropdown"
        [ngModel]="pageSize"
        (ngModelChange)="onPageSizeChange($event)"
        class="page-size-select"
        [clearable]="false"
      >
        @for (s of pageSizes; track s) {
          <ng-option [value]="s">{{ s }}</ng-option>
        }
      </ng-select>
    </div>
    <div class="page-controls">
      <button
        class="page-btn"
        [disabled]="currentPage <= 1"
        (click)="goToPage(1)"
        [title]="'CUSTOM_REPORTS.PAGINATION.FIRST' | translate"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M11 17l-5-5 5-5M18 17l-5-5 5-5" />
        </svg>
      </button>
      <button
        class="page-btn"
        [disabled]="currentPage <= 1"
        (click)="goToPage(currentPage - 1)"
        [title]="'CUSTOM_REPORTS.PAGINATION.PREVIOUS' | translate"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <button class="page-btn page-num active">{{ currentPage }}</button>
      <button
        class="page-btn"
        [disabled]="!hasNext"
        (click)="goToPage(currentPage + 1)"
        [title]="'CUSTOM_REPORTS.PAGINATION.NEXT' | translate"
      >
        <svg
          width="14"
          height="14"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M9 18l6-6-6-6" />
        </svg>
      </button>
    </div>
  </div>
}
