<!-- Header -->
<div class="px-5 py-4 border-b border-slate-100 shrink-0">
  <h2 class="text-lg font-semibold text-slate-900">{{ 'REPORTS.PERIOD.SELECT_RANGE' | translate }}</h2>
</div>

<!-- Body: presets + calendar (edits a draft) -->
<div class="px-4 py-4 flex-1 min-h-0 overflow-y-auto flex justify-center">
  <app-date-picker
    [inline]="true"
    [mode]="asOf() ? 'single' : 'range'"
    [value]="value()"
    (valueChange)="onValue($event)"
    [presets]="data.presets"
    [singlePresets]="true"
    [showFooter]="false"
    [clearable]="false"
    [monthsShown]="1"
    panelClass="!border-0 !shadow-none !p-0" />
</div>

<!-- Footer -->
<div class="flex items-center justify-between gap-3 px-5 py-3 border-t border-slate-100 bg-slate-50/50 shrink-0">
  @if (data.asOfOptional) {
    <label class="flex items-center gap-2 text-sm font-medium text-slate-700 cursor-pointer select-none">
      <input type="checkbox" class="w-4 h-4 rounded accent-brand-600 cursor-pointer"
        [checked]="asOf()" (change)="setAsOf($any($event.target).checked)" />
      {{ 'REPORTS.PERIOD.AS_OF' | translate }}
    </label>
  } @else {
    <span></span>
  }
  <div class="flex items-center gap-2.5">
    <button type="button" (click)="cancel()" class="px-4 py-2 text-sm font-medium text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button type="button" (click)="apply()" [disabled]="!canApply()"
      class="px-5 py-2 text-sm font-medium text-white bg-gradient-to-r from-brand-500 to-brand-700 rounded-lg shadow-sm hover:shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed">
      {{ 'COMMON.APPLY' | translate }}
    </button>
  </div>
</div>
