<div class="bo-fb">
  @if (isMobile()) {
    <button type="button" class="bo-btn bo-date-btn" (click)="openDateModal()" aria-haspopup="dialog">
      <span class="bo-date-text">{{ dateLabel() }}</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    </button>
  } @else {
  <!-- One picker for both modes, so the panel stays open when "As of" is toggled inside it. -->
  <app-date-picker
    class="bo-date"
    [mode]="asOf() ? 'single' : 'range'"
    [clearable]="false"
    [value]="asOf() ? singleValue() : rangeValue()"
    (valueChange)="asOf() ? onSingle($any($event)) : onRange($any($event))"
    [presets]="presets"
    [singlePresets]="asOfOptional()"
    [asOfOption]="asOfOptional()"
    [asOfChecked]="asOf()"
    [asOfLabel]="'REPORTS.PERIOD.AS_OF' | translate"
    (asOfChange)="onAsOf($event)"
    [monthsShown]="asOf() ? 1 : 2"
    displayFormat="MMM dd, yyyy"
    [placeholder]="(asOf() ? 'REPORTS.PERIOD.AS_OF' : 'REPORTS.PERIOD.CUSTOM') | translate"
    triggerClass="bo-btn">
  </app-date-picker>
  }

  @if (hasModal()) {
    <button type="button" class="bo-btn" (click)="openFilters()" aria-haspopup="dialog">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
      <span>{{ 'COMMON.FILTERS' | translate }}</span>
      @if (tags().length) { <span class="bo-badge">{{ tags().length }}</span> }
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
  }

  @if (tags().length) {
    <button type="button" class="bo-btn bo-clear" (click)="clearAll()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      <span>{{ 'COMMON.CLEAR_ALL' | translate }}</span>
    </button>
  }
</div>

@if (tags().length) {
  <div class="bo-applied">
    <span class="bo-applied-label">{{ 'REPORTS.BO.FILTERS.APPLIED' | translate }}:</span>
    @for (t of tags(); track t.key) {
      <span class="bo-tag">
        <span>{{ t.text }}</span>
        <button type="button" (click)="removeTag(t)" [attr.aria-label]="'REPORTS.BO.DISMISS' | translate">×</button>
      </span>
    }
  </div>
}
