<!--
  Layers / outline panel for the canvas. Each row is the same
  conceptual entity as a `.rbf-slot` on the canvas, just compacted
  into the rail's width. Reorder via drag handle, select via click,
  delete / duplicate via the chrome buttons.
-->
@if (isEmpty()) {
  <div class="el-list__empty">
    {{ 'RECEIPT_BUILDER.LAYERS.EMPTY' | translate }}
  </div>
} @else {
  <ul
    class="el-list"
    cdkDropList
    (cdkDropListDropped)="onDrop($event)"
  >
    @for (el of elements(); track trackEl($index, el); let i = $index) {
      <li
        class="el-list__item"
        [class.el-list__item--selected]="isSelected(el.__key)"
        cdkDrag
      >
        <div class="el-list__placeholder" *cdkDragPlaceholder></div>

        <span
          class="el-list__handle"
          cdkDragHandle
          [attr.aria-label]="'COMMON.DRAG_TO_REORDER' | translate"
          [appTooltip]="'COMMON.DRAG_TO_REORDER' | translate"
        >
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6"  x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </span>

        <button
          type="button"
          class="el-list__row"
          (click)="select.emit(el)"
        >
          <span class="el-list__icon" aria-hidden="true">
            <!-- Inline glyph keyed off the element type, same set as
                 the palette so the layers panel reads with the
                 user's mental model of what each tile is. -->
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              @switch (iconId(el)) {
                @case ('SideText') {
                  <line x1="3" y1="8" x2="10" y2="8"/>
                  <line x1="14" y1="8" x2="21" y2="8"/>
                  <line x1="3" y1="16" x2="10" y2="16"/>
                  <line x1="14" y1="16" x2="21" y2="16"/>
                }
                @case ('Text') {
                  <polyline points="4 7 4 4 20 4 20 7"/>
                  <line x1="9" y1="20" x2="15" y2="20"/>
                  <line x1="12" y1="4" x2="12" y2="20"/>
                }
                @case ('Line') {
                  <line x1="3" y1="12" x2="21" y2="12"/>
                }
                @case ('Spacer') {
                  <polyline points="6 9 12 3 18 9"/>
                  <polyline points="6 15 12 21 18 15"/>
                }
                @case ('Logo') {
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                }
                @case ('Image') {
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                }
                @case ('QrCode') {
                  <rect x="3"  y="3"  width="7" height="7"/>
                  <rect x="14" y="3"  width="7" height="7"/>
                  <rect x="3"  y="14" width="7" height="7"/>
                  <line x1="14" y1="14" x2="14" y2="21"/>
                  <line x1="14" y1="14" x2="21" y2="14"/>
                }
                @case ('Barcode') {
                  <line x1="4"  y1="4" x2="4"  y2="20"/>
                  <line x1="7"  y1="4" x2="7"  y2="20"/>
                  <line x1="11" y1="4" x2="11" y2="20"/>
                  <line x1="14" y1="4" x2="14" y2="20"/>
                  <line x1="17" y1="4" x2="17" y2="20"/>
                  <line x1="20" y1="4" x2="20" y2="20"/>
                }
                @case ('Table') {
                  <rect x="3" y="3" width="18" height="18" rx="2"/>
                  <line x1="3" y1="9"  x2="21" y2="9"/>
                  <line x1="3" y1="15" x2="21" y2="15"/>
                  <line x1="9" y1="3"  x2="9"  y2="21"/>
                }
              }
            </svg>
          </span>

          <span class="el-list__type">{{ ('RECEIPT_BUILDER.ELEMENTS.' + el.type) | translate }}</span>
          @if (summary(el); as text) {
            <span class="el-list__summary">{{ text }}</span>
          }
        </button>

        <button
          type="button"
          class="el-list__btn"
          (click)="duplicate.emit(el)"
          [attr.aria-label]="'COMMON.DUPLICATE' | translate"
          [appTooltip]="'COMMON.DUPLICATE' | translate"
        >
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
        <button
          type="button"
          class="el-list__btn el-list__btn--danger"
          (click)="remove.emit(el)"
          [attr.aria-label]="'COMMON.DELETE' | translate"
          [appTooltip]="'COMMON.DELETE' | translate"
        >
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </li>
    }
  </ul>
}
