<!-- Name — required. Locked entirely when `locked='all'`
     (system-default accounts can't be renamed in the legacy). -->
<label class="aff-field">
  <span class="aff-field__label">{{ 'CHART_OF_ACCOUNTS.FIELDS.NAME' | translate }}</span>
  <input class="aff-field__input"
    type="text"
    [value]="value?.name ?? ''"
    (input)="setName($any($event.target).value)"
    [disabled]="nameDisabled()"
    [placeholder]="namePlaceholderKey | translate"/>
</label>

<!-- Type — required. Locked once saved (legacy never allows type
     changes on existing accounts). -->
<label class="aff-field">
  <span class="aff-field__label">{{ 'CHART_OF_ACCOUNTS.FIELDS.TYPE' | translate }}</span>
  <app-search-dropdown
    [items]="types"
    [displayWith]="typeDisplay"
    [compareWith]="typeCompare"
    [toValue]="typeToValue"
    [groupBy]="typeGroupBy"
    [value]="selectedType()"
    [clearable]="false"
    [disabled]="typeDisabled()"
    [placeholder]="'CHART_OF_ACCOUNTS.FIELDS.TYPE_PLACEHOLDER' | translate"
    (valueChange)="setType($event)"/>
  <span class="aff-field__hint">{{ 'CHART_OF_ACCOUNTS.FIELDS.TYPE_HINT' | translate }}</span>
</label>

@if (!compact) {
  <!-- Parent account — optional. Only meaningful once a type is
       picked, since the list is filtered by type. Hidden until the
       user picks a type. Disabled when the row being edited already
       has children (can't be moved). -->
  @if (value?.type) {
    <label class="aff-field">
      <span class="aff-field__label">{{ 'CHART_OF_ACCOUNTS.FIELDS.PARENT' | translate }}</span>
      <app-search-dropdown
        [items]="parents()"
        [displayWith]="parentDisplay"
        [compareWith]="parentCompare"
        [toValue]="parentToValue"
        [value]="selectedParent()"
        [clearable]="true"
        [disabled]="!!value?.hasChild"
        [placeholder]="'CHART_OF_ACCOUNTS.FIELDS.PARENT_PLACEHOLDER' | translate"
        (valueChange)="setParent($event)"/>
      <span class="aff-field__hint">
        @if (value?.hasChild) {
          {{ 'CHART_OF_ACCOUNTS.FIELDS.PARENT_HAS_CHILD_HINT' | translate }}
        } @else {
          {{ 'CHART_OF_ACCOUNTS.FIELDS.PARENT_HINT' | translate }}
        }
      </span>
    </label>
  }

  <!-- Code — optional GL number. -->
  <label class="aff-field">
    <span class="aff-field__label">{{ 'CHART_OF_ACCOUNTS.FIELDS.CODE' | translate }}</span>
    <input class="aff-field__input"
      type="text"
      [value]="value?.code ?? ''"
      (input)="setCode($any($event.target).value)"
      [placeholder]="'CHART_OF_ACCOUNTS.FIELDS.CODE_PLACEHOLDER' | translate"/>
    <span class="aff-field__hint">{{ 'CHART_OF_ACCOUNTS.FIELDS.CODE_HINT' | translate }}</span>
  </label>

  <!-- Description — optional. -->
  <label class="aff-field">
    <span class="aff-field__label">{{ 'CHART_OF_ACCOUNTS.FIELDS.DESCRIPTION' | translate }}</span>
    <textarea class="aff-field__input aff-field__input--textarea"
      rows="2"
      [value]="value?.description ?? ''"
      (input)="setDescription($any($event.target).value)"
      [placeholder]="'CHART_OF_ACCOUNTS.FIELDS.DESCRIPTION_PLACEHOLDER' | translate"></textarea>
  </label>
}
