<app-modal-header [title]="'PRODUCTS.BULK_PRINT.PREVIEW_TITLE' | translate" />

<div class="pam__body">
  <p class="pam__count">
    {{ totalCount() }}
    {{ totalCount() === 1
        ? ('PRODUCTS.BULK_PRINT.LABEL' | translate)
        : ('PRODUCTS.BULK_PRINT.LABELS' | translate) }}
    ·
    {{ data.template.labelWidth }}″ × {{ data.template.labelHeight }}″
    ·
    {{ data.template.dpi }} DPI
  </p>

  <div class="pam__grid">
    @for (url of data.dataUrls; track $index) {
      <div class="pam__card" [style.aspect-ratio]="aspectRatio()">
        <img [src]="url" [attr.alt]="'Label ' + ($index + 1)"/>
        <span class="pam__index">{{ $index + 1 }}</span>
      </div>
    }
  </div>
</div>

<app-modal-footer>
  <button type="button" class="pam__btn pam__btn--ghost" (click)="cancel()">
    {{ 'COMMON.CLOSE' | translate }}
  </button>
  <button type="button" class="pam__btn pam__btn--primary" (click)="print()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 6 2 18 2 18 9"/>
      <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
      <rect x="6" y="14" width="12" height="8"/>
    </svg>
    {{ 'PRODUCTS.BULK_PRINT.PRINT' | translate }}
  </button>
</app-modal-footer>
