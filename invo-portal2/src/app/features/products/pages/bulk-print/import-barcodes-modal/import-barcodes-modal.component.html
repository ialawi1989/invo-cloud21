<app-modal-header [title]="'PRODUCTS.BULK_PRINT.IMPORT_TITLE' | translate" />

<div class="ibm__body">
  <p class="ibm__hint">{{ 'PRODUCTS.BULK_PRINT.IMPORT_HINT' | translate }}</p>

  <label class="ibm__field">
    <span>{{ 'PRODUCTS.BULK_PRINT.IMPORT_PASTE_LABEL' | translate }}</span>
    <textarea class="ibm__textarea" rows="8"
      [ngModel]="pasted()"
      (ngModelChange)="pasted.set($event)"
      [placeholder]="'PRODUCTS.BULK_PRINT.IMPORT_PASTE_PLACEHOLDER' | translate"></textarea>
  </label>

  <label class="ibm__file">
    <input type="file" accept=".csv,text/csv,text/plain" (change)="onFile($event)" hidden/>
    <span class="ibm__file-trigger">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
      </svg>
      {{ 'PRODUCTS.BULK_PRINT.IMPORT_PICK_FILE' | translate }}
    </span>
    @if (fileName()) {
      <span class="ibm__file-name">{{ fileName() }}</span>
    }
  </label>

  @if (parsedCount() > 0) {
    <p class="ibm__count">
      {{ parsedCount() }}
      {{ 'PRODUCTS.BULK_PRINT.IMPORT_BARCODE_COUNT' | translate }}
    </p>
  }
</div>

<app-modal-footer>
  <button type="button" class="ibm__btn ibm__btn--ghost" (click)="cancel()">
    {{ 'COMMON.CANCEL' | translate }}
  </button>
  <button type="button" class="ibm__btn ibm__btn--primary"
    [disabled]="parsedCount() === 0"
    (click)="apply()">
    {{ 'PRODUCTS.BULK_PRINT.IMPORT_ACTION' | translate }}
  </button>
</app-modal-footer>
