<app-entity-selector
  [items]="items()"
  [mode]="resolvedMode()"
  [closable]="closable()"
  [maxVisible]="maxVisible()"
  [maxVisibleMobile]="maxVisibleMobile()"
  [completion]="completion()"
  [showProgress]="showProgress()"
  [showBulkActions]="showBulkActions()"
  [searchLabel]="'PRODUCTS.FORM.BRANCH_TABS_SEARCH'"
  [findLabel]="'PRODUCTS.FORM.BRANCH_TABS_FIND'"
  [pinnedLabel]="'PRODUCTS.FORM.BRANCH_TABS_PINNED'"
  [recentLabel]="'PRODUCTS.FORM.BRANCH_TABS_RECENT'"
  [allLabel]="'PRODUCTS.FORM.BRANCH_TABS_ALL'"
  [noMatchLabel]="'PRODUCTS.FORM.BRANCH_TABS_NO_MATCH'"
  [pinLabel]="'PRODUCTS.FORM.BRANCH_TABS_PIN'"
  [unpinLabel]="'PRODUCTS.FORM.BRANCH_TABS_UNPIN'"
  [applyToAllLabel]="'PRODUCTS.FORM.BRANCH_TABS_APPLY_ALL'"
  [copyFromLabel]="'PRODUCTS.FORM.BRANCH_TABS_COPY_FROM'"
  [progressLabel]="'PRODUCTS.FORM.BRANCH_TABS_PROGRESS'"
  [statusDoneLabel]="'PRODUCTS.FORM.BRANCH_TABS_STATUS_DONE'"
  [statusPartialLabel]="'PRODUCTS.FORM.BRANCH_TABS_STATUS_PARTIAL'"
  (activeChange)="activeChange.emit($event)"
  (applyToAll)="applyToAll.emit()"
  (copyFrom)="copyFrom.emit($event)">

  <!-- Online indicator: a dot in tabs/sidebar/dropdown, a text pill in popover
       rows. `ctx` is the render context passed by the generic component. -->
  <ng-template #status let-item let-ctx="context">
    @if (ctx === 'popover-row') {
      <span class="bt-pill" [class.bt-pill--on]="item.status === 'online'">
        {{ (item.status === 'online' ? 'PRODUCTS.FORM.ONLINE' : 'PRODUCTS.FORM.BRANCH_TABS_OFFLINE') | translate }}
      </span>
    } @else {
      <span class="bt-dot" [class.bt-dot--on]="item.status === 'online'" aria-hidden="true"></span>
    }
  </ng-template>
</app-entity-selector>
