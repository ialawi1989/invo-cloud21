<div class="flex flex-col gap-5">

  <section class="rounded-xl border border-slate-200 bg-white p-4">
    <label class="block text-sm font-semibold text-slate-800 mb-1">{{ 'PRODUCTS.PRODUCT_SHEET.PRESET' | translate }}</label>
    <app-search-dropdown
      [items]="presetItems()"
      [displayWith]="display"
      [compareWith]="compare"
      [toValue]="toValue"
      [clearable]="false"
      [searchable]="false"
      [disabled]="busy()"
      [placeholder]="'PRODUCTS.PRODUCT_SHEET.CUSTOM_COLUMNS' | translate"
      [value]="selectedPresetItem()"
      (valueChange)="applyPreset($any($event))"/>
    <p class="text-xs text-slate-500 mt-1">{{ 'PRODUCTS.PRODUCT_SHEET.PRESET_HINT' | translate }}</p>
  </section>

  <section class="rounded-xl border border-slate-200 bg-white p-4">
    <label class="block text-sm font-semibold text-slate-800 mb-3">{{ 'PRODUCTS.PRODUCT_SHEET.COLUMNS' | translate }}</label>
    <div class="flex flex-col gap-4">
      @for (entry of columnGroups(); track entry.group) {
        <div>
          <label class="flex items-center gap-2 text-sm font-semibold text-slate-700 mb-1.5 cursor-pointer">
            <input type="checkbox" [disabled]="busy()"
              [checked]="groupState(entry.columns) === 'all'"
              [indeterminate]="groupState(entry.columns) === 'some'"
              (change)="toggleGroup(entry.columns, $any($event.target).checked)"/>
            {{ ('PRODUCTS.PRODUCT_SHEET.GROUP.' + entry.group) | translate }}
          </label>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-4 gap-y-1 ps-6">
            @for (column of entry.columns; track column.key) {
              <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                <input type="checkbox" [disabled]="busy() || isLocked(column.key)"
                  [checked]="selected().has(column.key)"
                  (change)="toggle(column.key, $any($event.target).checked)"/>
                <span>{{ column.header }}</span>
                @if (column.types !== 'all' || column.createOnly) {
                  <span class="inline-flex text-slate-400 hover:text-slate-600" [appTooltip]="columnHint(column)" [attr.aria-label]="columnHint(column)">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>
                    </svg>
                  </span>
                }
              </label>
            }
          </div>
        </div>
      }
    </div>
  </section>

  <!-- Branch columns are read from one branch; its name goes into the file name, not the headers. -->
  @if (needsBranch()) {
    <section class="rounded-xl border border-slate-200 bg-white p-4">
      <label class="block text-sm font-semibold text-slate-800 mb-1">
        {{ 'PRODUCTS.PRODUCT_SHEET.EXPORT_BRANCH' | translate }} <span class="text-red-500">*</span>
      </label>
      <app-search-dropdown
        [items]="branchItems()"
        [displayWith]="display"
        [compareWith]="compare"
        [toValue]="toValue"
        [clearable]="false"
        [searchable]="true"
        [disabled]="busy()"
        [placeholder]="'PRODUCTS.PRODUCT_SHEET.CHOOSE_BRANCH' | translate"
        [value]="selectedBranchItem()"
        (valueChange)="onBranchChange($any($event))"/>
      <p class="text-xs text-slate-500 mt-1">{{ 'PRODUCTS.PRODUCT_SHEET.EXPORT_BRANCH_HINT' | translate }}</p>
    </section>
  }

  <section class="rounded-xl border border-slate-200 bg-white p-4">
    <label class="block text-sm font-semibold text-slate-800 mb-2">{{ 'PRODUCTS.PRODUCT_SHEET.FORMAT' | translate }}</label>
    <app-segmented-toggle [options]="formatOptions" [value]="format()" (valueChange)="setFormat($any($event))"/>
  </section>

  @if (error()) {
    <p class="rounded-lg border border-red-200 bg-red-50 text-red-700 text-sm px-3 py-2" role="alert">{{ error() }}</p>
  }

  <div class="flex justify-end">
    <button type="button" [disabled]="!canExport()" (click)="export()"
      class="px-5 py-2.5 rounded-lg font-medium text-white bg-gradient-to-r from-brand-500 to-brand-700 shadow
             hover:from-brand-600 hover:to-brand-800 disabled:opacity-50 disabled:cursor-not-allowed transition-all">
      {{ 'PRODUCTS.PRODUCT_SHEET.EXPORT_BUTTON' | translate }}
    </button>
  </div>
</div>
