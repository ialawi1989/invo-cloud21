<app-list-page
  [pageTitle]="'PRODUCTS.CATEGORIES.TITLE' | translate"
  [columns]="columns"
  [dataSource]="loadCategories"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="[]"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState"
  [entityType]="'category'"
  [mobileCardConfig]="mobileCardConfig"
  (rowClicked)="onRowClick($event)">

  <div listHeaderActions class="flex items-center gap-3">
    @if (canAdd) {
      <button type="button" (click)="add()"
        class="flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-lg font-medium whitespace-nowrap bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="hidden sm:inline">{{ 'PRODUCTS.CATEGORIES.ADD_NEW' | translate }}</span>
        <span class="sm:hidden">{{ 'PRODUCTS.CATEGORIES.ADD_NEW_SHORT' | translate }}</span>
      </button>
    }
  </div>

  <!-- Name — cover thumbnail + category name. -->
  <ng-template listCellTemplate="name" let-row>
    <div class="flex items-center gap-3">
      <span class="w-9 h-9 rounded-md bg-slate-50 border border-slate-200 flex items-center justify-center flex-shrink-0 overflow-hidden text-slate-400">
        @if (row.thumbnailUrl) {
          <img [src]="row.thumbnailUrl" alt="" class="w-full h-full object-cover" />
        } @else {
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
        }
      </span>
      <span class="font-medium text-slate-900 min-w-0 break-words list-interactive-cell">{{ row.name || '—' }}</span>
    </div>
  </ng-template>

  <!-- Row actions — Edit on hover; ⋯ menu holds Delete. -->
  <ng-template listRowActions let-row>
    @let overflow = overflowActions(row);
    <div class="inline-flex items-center justify-end" (click)="$event.stopPropagation()">
      @if (canEdit) {
        <button type="button"
          (click)="edit(row)"
          class="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity
                 me-2 px-4 h-9 inline-flex items-center rounded-full
                 bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
          {{ 'COMMON.EDIT' | translate }}
        </button>
      }
      @if (overflow.length) {
        <app-dropdown-menu-btn
          [items]="overflow"
          [appendToBody]="true"
          [chevron]="false"
          align="end"
          triggerClass="w-9 h-9 inline-flex items-center justify-center rounded-full bg-white text-slate-500 border border-slate-200 hover:text-brand-600 hover:border-brand-300 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </app-dropdown-menu-btn>
      }
    </div>
  </ng-template>

</app-list-page>
