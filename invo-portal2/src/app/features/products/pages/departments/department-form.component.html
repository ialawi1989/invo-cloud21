<div class="clf-page" [formGroup]="form">
  <app-page-header [title]="pageTitle()" [trail]="breadcrumbs()">
<app-form-actions pageActions>
    <button formActionSecondary type="button" (click)="cancel()" [disabled]="saving()">
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button formActionPrimary type="button" (click)="save()" [disabled]="saving() || loading() || form.invalid">
      {{ 'COMMON.SAVE' | translate }}
    </button>
</app-form-actions>
</app-page-header>

  @if (loading()) {
    <app-form-skeleton />
  } @else {
    <section class="card">
      <header class="card__head">
        <h2 class="card__title">{{ 'PRODUCTS.DEPARTMENTS.IDENTITY' | translate }}</h2>
        <p class="card__sub">{{ 'PRODUCTS.DEPARTMENTS.IDENTITY_DESC' | translate }}</p>
      </header>
      <div class="card__body">
        <div class="field">
          <label class="field-label field-label--with-action" for="dept-name">
            <span>
              {{ 'PRODUCTS.DEPARTMENTS.NAME' | translate }}
              <span class="required">*</span>
            </span>
            <app-translate-link (clicked)="openNameTranslationModal()"/>
          </label>
          <input
            id="dept-name"
            type="text"
            class="input"
            formControlName="name"
            [placeholder]="'PRODUCTS.DEPARTMENTS.NAME_PLACEHOLDER' | translate"
            [class.input--invalid]="nameCtrl.touched && nameCtrl.invalid"
          />
          @if (nameCtrl.touched && nameCtrl.errors?.['required']) {
            <p class="field-error">{{ 'PRODUCTS.DEPARTMENTS.NAME_REQUIRED' | translate }}</p>
          }
        </div>
      </div>
    </section>
  }

  <app-loading-overlay [show]="saving()" [message]="saveLabel()"/>

  
</div>
