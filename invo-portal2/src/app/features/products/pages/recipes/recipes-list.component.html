<app-list-page
  [pageTitle]="'PRODUCTS.RECIPES.TITLE' | translate"
  [columns]="columns"
  [dataSource]="loadRecipes"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="[]"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState"
  [entityType]="'recipe'"
  [mobileCardConfig]="mobileCardConfig"
  (rowClicked)="onRowClick($event)">

  <div listHeaderActions class="flex items-center gap-3">
    @if (canAdd) {
      <button type="button" (click)="add()"
        class="flex items-center gap-2 px-4 sm:px-5 py-2.5 rounded-lg font-medium whitespace-nowrap bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        <span class="hidden sm:inline">{{ 'PRODUCTS.RECIPES.ADD_NEW' | translate }}</span>
        <span class="sm:hidden">{{ 'PRODUCTS.RECIPES.ADD_NEW_SHORT' | translate }}</span>
      </button>
    }
    <app-dropdown-menu-btn
      [items]="moreMenuItems"
      [appendToBody]="true"
      [chevron]="false"
      align="end"
      triggerClass="flex items-center justify-center w-10 h-10 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 transition-colors">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
      </svg>
    </app-dropdown-menu-btn>
  </div>

  <!-- Expanded row: the recipe's items. Loaded lazily on open. -->
  <ng-template listRowDetail let-row>
    <app-prep-recipe-panel
      ownerType="recipe"
      [ownerId]="row.id"
      [autoLoad]="true"/>
  </ng-template>

  <ng-template listCellTemplate="name" let-row>
    <span class="font-medium text-slate-900 min-w-0 break-words list-interactive-cell">{{ row.name || '—' }}</span>
  </ng-template>

  <!-- Row actions — Edit revealed on hover (brands have no delete). -->
  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end" (click)="$event.stopPropagation()">
      @if (canEdit) {
        <button type="button"
          (click)="edit(row)"
          class="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity
                 px-4 h-9 inline-flex items-center rounded-full
                 bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
          {{ 'COMMON.EDIT' | translate }}
        </button>
      }
    </div>
  </ng-template>

</app-list-page>
