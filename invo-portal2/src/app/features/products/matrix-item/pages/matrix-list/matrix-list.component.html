<app-list-page
  [pageTitle]="'MATRIX.LIST.TITLE' | translate"
  [breadcrumbs]="breadcrumbs"
  [columns]="columns"
  [dataSource]="loadMatrix"
  [pagination]="paginationConfig"
  [search]="searchConfig"
  [sorting]="sortingConfig"
  [filters]="[]"
  [headerActions]="[]"
  [selectable]="false"
  [emptyState]="emptyState"
  [entityType]="'matrix-item'"
  (rowClicked)="onRowClick($event)">

  <!-- Header action: New Matrix Item -->
  <div listHeaderActions class="flex items-center gap-3">
    <button type="button" (click)="add()"
      class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      {{ 'MATRIX.LIST.ADD_NEW' | translate }}
    </button>
  </div>

  <!-- Barcode — monospace so codes align down the list. -->
  <ng-template listCellTemplate="barcode" let-row>
    <span class="font-mono text-xs text-slate-500">{{ row.barcode || '—' }}</span>
  </ng-template>

  <!-- Price — company currency via the shared mycurrency pipe. -->
  <ng-template listCellTemplate="defaultPrice" let-row>
    <span class="tabular-nums">{{ (row.defaultPrice || 0) | mycurrency }}</span>
  </ng-template>

  <!-- Row actions: Edit -->
  <ng-template listRowActions let-row>
    <div class="inline-flex items-center" (click)="$event.stopPropagation()">
      <app-dropdown-menu-btn
        [items]="rowMenuItems(row)"
        [appendToBody]="true"
        [chevron]="false"
        align="end"
        triggerClass="w-9 h-9 inline-flex items-center justify-center rounded-full bg-white text-slate-500 border border-slate-200 hover:text-brand-600 hover:border-brand-300 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
        </svg>
      </app-dropdown-menu-btn>
    </div>
  </ng-template>

</app-list-page>
