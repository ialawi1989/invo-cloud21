<app-modal-header [title]="'MATRIX.DIMENSION.ADD_DIMENSION' | translate"/>

<div class="adm__body">
  <!-- Name -->
  <label class="adm__field">
    <span class="adm__label">{{ 'MATRIX.DIMENSION.DIMENSION_NAME' | translate }}</span>
    <input class="adm__input"
      type="text"
      [value]="name()"
      (input)="onNameInput($any($event.target).value)"
      [placeholder]="'MATRIX.DIMENSION.DIMENSION_PLACEHOLDER' | translate"
      [class.adm__input--err]="!!nameError()"/>
    @if (nameError()) {
      <span class="adm__err">{{ nameError() | translate }}</span>
    }
  </label>

  <!-- Predefined suggestions -->
  @if (suggestions().length > 0) {
    <div class="adm__field">
      <span class="adm__label">{{ 'MATRIX.DIMENSION.SELECT_PREDEFINED' | translate }}</span>
      <div class="adm__suggestions">
        @for (s of suggestions(); track s.type) {
          <button type="button" class="adm__chip" (click)="pickSuggestion(s)">
            {{ s.label }}
          </button>
        }
      </div>
    </div>
  }

  <!-- Display type -->
  <div class="adm__field">
    <span class="adm__label">{{ 'MATRIX.DIMENSION.DISPLAY_TYPE' | translate }}</span>
    <app-segmented-toggle
      [options]="displayTypeOptions"
      [value]="displayType()"
      (valueChange)="onDisplayTypeChange($event)"/>
  </div>

  <!-- "Pick from saved dimensions" lives in its own dedicated button/modal in
       the Dimensions header (bulk multi-select) — kept out of here so this
       modal is purely "create a new dimension". -->
</div>

<app-modal-footer>
  <button type="button" class="btn btn-ghost" (click)="cancel()">
    {{ 'MATRIX.FORM.CANCEL' | translate }}
  </button>
  <button type="button" class="btn btn-primary" (click)="confirm()" [disabled]="!canConfirm()">
    {{ 'MATRIX.DIMENSION.ADD_DIMENSION' | translate }}
  </button>
</app-modal-footer>
