<app-list-page
  [pageTitle]="'PRICE_LABEL.LIST.TITLE' | translate"
  [pageSubtitle]="'PRICE_LABEL.LIST.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [columns]="columns()"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig()"
  [sorting]="sortingConfig"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState()"
  [entityType]="'price-label'"
  (rowClicked)="edit($event.row)">

  <div listHeaderActions class="flex items-center gap-3">
    <button type="button" (click)="addNew()"
      class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      {{ 'PRICE_LABEL.LIST.ADD_NEW' | translate }}
    </button>
  </div>

  <ng-template listCellTemplate="name" let-row>
    <span class="font-medium text-slate-900">{{ row.name || '—' }}</span>
  </ng-template>

  <ng-template listCellTemplate="productsCount" let-row>
    <span class="inline-flex items-center rounded-full bg-brand-50 px-2.5 py-1 text-xs font-semibold text-brand-700 tabular-nums">{{ productsCount(row) }}</span>
  </ng-template>

  <ng-template listCellTemplate="optionsCount" let-row>
    <span class="inline-flex items-center rounded-full bg-amber-50 px-2.5 py-1 text-xs font-semibold text-amber-700 tabular-nums">{{ optionsCount(row) }}</span>
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end" (click)="$event.stopPropagation()">
      <app-dropdown-menu-btn [items]="rowMenuItems(row)" [appendToBody]="true" [chevron]="false" align="end" triggerClass="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="19" cy="12" r="1.75"/>
        </svg>
      </app-dropdown-menu-btn>
    </div>
  </ng-template>
</app-list-page>
