<app-list-page
  [pageTitle]="'SETTINGS.ITEMS.BRANCH_SETTINGS' | translate"
  [pageSubtitle]="'SETTINGS.ITEMS.BRANCH_SETTINGS_DESC' | translate"
  [breadcrumbs]="breadcrumbs()"
  [columns]="columns()"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig()"
  [sorting]="sortingConfig"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState()"
  [entityType]="'branch'"
  (rowClicked)="edit($event.row)">

  <ng-template listCellTemplate="name" let-row>
    <div class="flex items-center gap-2">
      <span class="font-medium text-slate-900">{{ row.name || '—' }}</span>
      @if (row.mainBranch) {
        <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">{{ 'SETTINGS.BRANCHES.MAIN' | translate }}</span>
      }
      @if (row.isEcommerceDefault) {
        <span class="text-xs font-medium px-2 py-0.5 rounded-full bg-teal-50 text-teal-700">{{ 'SETTINGS.BRANCHES.DEFAULT' | translate }}</span>
      }
    </div>
  </ng-template>

  <ng-template listCellTemplate="phoneNumber" let-row>
    <span class="text-slate-700">{{ row.phoneNumber || '—' }}</span>
  </ng-template>

  <ng-template listCellTemplate="address" let-row>
    <span class="text-slate-700">{{ row.address || '—' }}</span>
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end gap-2 whitespace-nowrap" (click)="$event.stopPropagation()">
      @if (!row.isEcommerceDefault) {
        <button type="button" (click)="setDefault(row); $event.stopPropagation()"
          class="shrink-0 opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity px-4 h-9 inline-flex items-center rounded-full bg-white text-slate-700 text-sm font-medium border border-slate-300 shadow-sm hover:bg-slate-50">
          {{ 'SETTINGS.BRANCHES.SET_AS_DEFAULT' | translate }}
        </button>
      }
      <button type="button" (click)="edit(row); $event.stopPropagation()"
        class="shrink-0 opacity-0 group-hover:opacity-100 focus-visible:opacity-100 transition-opacity px-4 h-9 inline-flex items-center rounded-full bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
        {{ 'COMMON.EDIT' | translate }}
      </button>
    </div>
  </ng-template>
</app-list-page>
