<app-list-shell
  [title]="'SETTINGS.ITEMS.CUSTOM_FIELDS' | translate"
  [subtitle]="'SETTINGS.CUSTOM_FIELDS.LIST_SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [search]="search()"
  [searchPlaceholder]="'SETTINGS.CUSTOM_FIELDS.SEARCH_PLACEHOLDER' | translate"
  [searchLive]="true"
  [loading]="loading()"
  [hasRows]="filteredRows().length > 0"
  [hideCard]="true"
  (searchChange)="onSearch($event)"
  (searchClear)="clearSearch()">

  @if (totalActive() > 0) {
    <div shellActions class="kpi">
      <span class="kpi__num">{{ totalActive() }}</span>
      <span class="kpi__label">{{ 'SETTINGS.CUSTOM_FIELDS.TOTAL_ACTIVE' | translate }}</span>
    </div>
  }

  <div shellEmpty>
    <p>{{ 'COMMON.NO_DATA' | translate }}</p>
  </div>

  <div class="cards-grid">
    @for (row of filteredRows(); track row.type) {
      <button
        type="button"
        class="card"
        (click)="open(row)"
        [attr.aria-label]="row.label"
      >
        <span class="card__icon" [class]="row.color">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [innerHTML]="row.icon | safeHtml"></svg>
        </span>
        <span class="card__body">
          <span class="card__title">{{ row.label }}</span>
          <span class="card__sub">
            @if (row.active === 0) {
              {{ 'SETTINGS.CUSTOM_FIELDS.NO_FIELDS' | translate }}
            } @else if (row.active === 1) {
              {{ 'SETTINGS.CUSTOM_FIELDS.ONE_FIELD' | translate }}
            } @else {
              {{ 'SETTINGS.CUSTOM_FIELDS.N_FIELDS' | translate: { count: row.active } }}
            }
            @if (row.deleted > 0) {
              <span class="card__sub-trash">
                · {{ 'SETTINGS.CUSTOM_FIELDS.N_DELETED' | translate: { count: row.deleted } }}
              </span>
            }
          </span>
        </span>
        <svg class="card__chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    }
  </div>
</app-list-shell>
