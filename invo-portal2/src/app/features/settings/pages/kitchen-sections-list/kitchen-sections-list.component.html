<app-list-shell
  [title]="'SETTINGS.ITEMS.KITCHEN_SECTION' | translate"
  [subtitle]="'SETTINGS.KITCHEN.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [search]="search()"
  [searchPlaceholder]="'SETTINGS.KITCHEN.SEARCH_PLACEHOLDER' | translate"
  [page]="page()"
  [pageCount]="pageCount()"
  [total]="total()"
  [rangeLabel]="rangeLabel()"
  [loading]="loading()"
  [hasRows]="rows().length > 0"
  [cardFlush]="true"
  (searchChange)="onSearch($event)"
  (searchClear)="clearSearch()"
  (prevPage)="goPrev()"
  (nextPage)="goNext()">

  <button shellActions type="button" class="btn btn-primary" (click)="addNew()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    {{ 'SETTINGS.KITCHEN.ADD_NEW' | translate }}
  </button>

  <div shellEmpty>
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 22h20"/><path d="M3.77 10.77 2 22h20l-1.77-11.23a2 2 0 0 0-1.97-1.77H5.74a2 2 0 0 0-1.97 1.77z"/>
      <path d="M6 9V5a3 3 0 0 1 3-3h6a3 3 0 0 1 3 3v4"/>
    </svg>
    <p>{{ (search() ? 'SETTINGS.KITCHEN.NO_MATCH' : 'SETTINGS.KITCHEN.EMPTY') | translate }}</p>
    @if (!search()) {
      <button type="button" class="btn btn-ghost btn-sm" (click)="addNew()">
        {{ 'SETTINGS.KITCHEN.ADD_NEW' | translate }}
      </button>
    }
  </div>

  <table class="table" role="grid">
    <thead>
      <tr>
        <th class="table__name">{{ 'SETTINGS.KITCHEN.NAME' | translate }}</th>
        <th class="table__products">{{ 'SETTINGS.KITCHEN.PRODUCT_COUNT' | translate }}</th>
        <th class="table__actions"></th>
      </tr>
    </thead>
    <tbody>
      @for (s of rows(); track s.id) {
        <tr (click)="edit(s)">
          <td class="table__name">
            <span class="row-name">{{ s.name || '—' }}</span>
          </td>
          <td class="table__products">
            <span class="count-chip">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              </svg>
              {{ s.productCount }}
            </span>
          </td>
          <td class="table__actions">
            <button
              type="button"
              class="icon-btn"
              (click)="$event.stopPropagation(); edit(s)"
              [attr.aria-label]="'COMMON.EDIT' | translate"
            >
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/>
              </svg>
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</app-list-shell>
