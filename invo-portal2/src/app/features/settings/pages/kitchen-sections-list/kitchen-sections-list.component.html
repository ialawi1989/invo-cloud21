<app-list-page
  [pageTitle]="'SETTINGS.ITEMS.KITCHEN_SECTION' | translate"
  [pageSubtitle]="'SETTINGS.KITCHEN.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [columns]="columns()"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig()"
  [sorting]="sortingConfig"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState()"
  [entityType]="'kitchen-section'"
  (rowClicked)="edit($event.row)">

  <div listHeaderActions class="flex items-center gap-3">
    <button type="button" (click)="addNew()"
      class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      {{ 'SETTINGS.KITCHEN.ADD_NEW' | translate }}
    </button>
  </div>

  <ng-template listCellTemplate="name" let-row>
    <span class="font-medium text-slate-900">{{ row.name || '—' }}</span>
  </ng-template>

  <ng-template listCellTemplate="productCount" let-row>
    <span class="inline-flex items-center gap-1.5 text-xs font-semibold px-2.5 py-1 rounded-full bg-brand-50 text-brand-700">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
      </svg>
      {{ row.productCount }}
    </span>
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end gap-2" (click)="$event.stopPropagation()">
      <button type="button" (click)="edit(row); $event.stopPropagation()"
        class="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 [@media(hover:none)]:opacity-100 transition-opacity px-4 h-9 inline-flex items-center rounded-full bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
        {{ 'COMMON.EDIT' | translate }}
      </button>
    </div>
  </ng-template>
</app-list-page>
