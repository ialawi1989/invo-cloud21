<div class="estimate-options-page" [formGroup]="form">
  <app-page-header [title]="'SETTINGS.ITEMS.ESTIMATE_OPTIONS' | translate" [description]="'SETTINGS.ITEMS.ESTIMATE_OPTIONS_DESC' | translate" [trail]="breadcrumbs()">
<app-form-actions pageActions>
    <button formActionSecondary
      type="button"
      (click)="back()"
      [disabled]="saving()"
    >
      {{ 'COMMON.CANCEL' | translate }}
    </button>
    <button formActionPrimary
      type="button"
      (click)="save()"
      [disabled]="saving() || loading() || form.invalid"
    >
      {{ 'COMMON.SAVE' | translate }}
    </button>
</app-form-actions>
</app-page-header>

  @if (loading()) {
    <app-form-skeleton />
  } @else {
    <form [formGroup]="form">
      <!-- ═══ Default Content ═══ -->
      <section class="card">
        <header class="card__head">
          <h2 class="card__title">{{ 'SETTINGS.ESTIMATE.DEFAULT_CONTENT' | translate }}</h2>
          <p class="card__sub">{{ 'SETTINGS.ESTIMATE.DEFAULT_CONTENT_DESC' | translate }}</p>
        </header>

        <div class="card__body" formGroupName="estimateOptions">
          <div class="grid grid--1">
            <div class="field">
              <label class="field-label" for="estimate-note">
                {{ 'SETTINGS.ESTIMATE.NOTE' | translate }}
              </label>
              <textarea
                id="estimate-note"
                class="textarea"
                formControlName="note"
                rows="4"
                placeholder="{{ 'SETTINGS.ESTIMATE.NOTE_HINT' | translate }}"
              ></textarea>
              <p class="field-hint">{{ 'SETTINGS.ESTIMATE.NOTE_DESCRIPTION' | translate }}</p>
            </div>

            <div class="field">
              <label class="field-label" for="estimate-term">
                {{ 'SETTINGS.ESTIMATE.TERM' | translate }}
              </label>
              <textarea
                id="estimate-term"
                class="textarea"
                formControlName="term"
                rows="4"
                placeholder="{{ 'SETTINGS.ESTIMATE.TERM_HINT' | translate }}"
              ></textarea>
              <p class="field-hint">{{ 'SETTINGS.ESTIMATE.TERM_DESCRIPTION' | translate }}</p>
            </div>
          </div>
        </div>
      </section>
    </form>
  }

  <app-loading-overlay [show]="saving()" [message]="saveLabel()"/>

  
</div>
