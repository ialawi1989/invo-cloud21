<app-list-page
  [pageTitle]="'RECEIPT_BUILDER.TITLE' | translate"
  [pageSubtitle]="'RECEIPT_BUILDER.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [columns]="columns()"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig()"
  [sorting]="sortingConfig"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState()"
  [entityType]="'receipt-builder'"
  (rowClicked)="edit($event.row)">

  <div listHeaderActions class="flex items-center gap-3">
    <app-dropdown-menu-btn [items]="addMenuItems()" align="end" triggerClass="btn btn-primary">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      {{ 'RECEIPT_BUILDER.ADD_NEW' | translate }}
    </app-dropdown-menu-btn>
  </div>

  <ng-template listCellTemplate="name" let-row>
    <span class="font-medium text-slate-900">{{ row.name || '—' }}</span>
  </ng-template>

  <ng-template listCellTemplate="templateType" let-row>
    <span class="inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold"
          [class]="row.templateType === 'kitchen' ? 'bg-amber-100 text-amber-800' : 'bg-brand-50 text-brand-700'">
      {{ (row.templateType === 'kitchen' ? 'RECEIPT_BUILDER.TYPE_KITCHEN' : 'RECEIPT_BUILDER.TYPE_RECEIPT') | translate }}
    </span>
  </ng-template>

  <ng-template listCellTemplate="elementsCount" let-row>
    <span class="inline-flex items-center rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 tabular-nums">{{ row.elementsCount }}</span>
  </ng-template>

  <ng-template listCellTemplate="updatedDate" let-row>
    <span class="text-sm text-slate-700">{{ row.updatedDate ? (row.updatedDate | date: 'mediumDate') : '—' }}</span>
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end" (click)="$event.stopPropagation()">
      <app-dropdown-menu-btn [items]="rowMenuItems(row)" [appendToBody]="true" [chevron]="false" align="end" triggerClass="icon-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.75"/><circle cx="12" cy="12" r="1.75"/><circle cx="19" cy="12" r="1.75"/>
        </svg>
      </app-dropdown-menu-btn>
    </div>
  </ng-template>
</app-list-page>
