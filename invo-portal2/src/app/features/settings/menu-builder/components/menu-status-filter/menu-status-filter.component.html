<div role="radiogroup" [attr.aria-label]="'MENU_BUILDER.STATUS.FILTER_LABEL' | translate" class="flex flex-wrap items-center gap-2">
  @for (o of options(); track o.key; let i = $index) {
    <button type="button" role="radio" [attr.aria-checked]="value() === o.id" [attr.tabindex]="value() === o.id ? 0 : -1"
            (click)="select(o.id)" (keydown)="onKey($event, i)"
            class="inline-flex items-center gap-2 rounded-full border px-3.5 py-1.5 text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-600"
            [class]="value() === o.id ? 'border-brand-600 bg-brand-600 text-white' : 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'">
      {{ ('MENU_BUILDER.STATUS.FILTER.' + o.key) | translate }}
    </button>
  }
</div>
