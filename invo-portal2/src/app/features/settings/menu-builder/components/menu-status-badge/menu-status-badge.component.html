<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs ring-1 ring-inset whitespace-nowrap" [class]="tone()" [attr.data-status]="status()">
  @switch (status()) {
    @case ('ACTIVE') {
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3" fill="currentColor"/>
      </svg>
      <span class="badge-label">{{ 'MENU_BUILDER.STATUS.ACTIVE' | translate }}</span>
    }
    @case ('SCHEDULED') {
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>
      </svg>
      <span class="badge-label">{{ 'MENU_BUILDER.STATUS.STARTS_AT' | translate: { time: startLabel() } }}</span>
    }
    @default {
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><polyline points="8 12.5 11 15.5 16 9.5"/>
      </svg>
      <span class="badge-label">{{ 'MENU_BUILDER.STATUS.ENDED_AT' | translate: { time: endLabel() } }}</span>
    }
  }
</span>
