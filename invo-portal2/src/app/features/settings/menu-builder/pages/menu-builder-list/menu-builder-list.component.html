<app-list-page
  [pageTitle]="'MENU_BUILDER.TITLE' | translate"
  [pageSubtitle]="'MENU_BUILDER.SUBTITLE' | translate"
  [breadcrumbs]="breadcrumbs()"
  [columns]="columns()"
  [dataSource]="load"
  [pagination]="paginationConfig"
  [search]="searchConfig()"
  [sorting]="sortingConfig"
  [headerActions]="[]"
  [selectable]="false"
  [fitContent]="true"
  [emptyState]="emptyState()"
  [entityType]="'menu-builder'"
  (rowClicked)="edit($event.row)">

  <div listHeaderActions class="flex items-center gap-3">
    <button type="button" (click)="arrange()"
      class="flex items-center gap-2 px-4 py-2.5 rounded-lg font-medium border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition-colors">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>
      {{ 'MENU_BUILDER.ARRANGE.BUTTON' | translate }}
    </button>
    <button type="button" (click)="addNew()"
      class="flex items-center gap-2 px-5 py-2.5 rounded-lg font-medium bg-gradient-to-r from-brand-500 to-brand-700 text-white shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      {{ 'MENU_BUILDER.ADD_NEW' | translate }}
    </button>
  </div>

  <div listSubHeader class="flex flex-col gap-3 pb-3">
    <app-menu-status-filter [value]="status()" (valueChange)="setStatus($event)"/>
  </div>

  <ng-template listCellTemplate="name" let-row>
    <span class="font-medium text-slate-900">{{ row.name || '—' }}</span>
  </ng-template>

  <ng-template listCellTemplate="status" let-row>
    @if (row.status) {
      <app-menu-status-badge [status]="row.status" [startAt]="row.startAt" [endAt]="row.endAt" [use12h]="use12h()" [locale]="locale()"/>
    }
  </ng-template>

  <!-- The grid (card) view shows the same badge. -->
  <ng-template listMobileChip let-row>
    @if (row.status) {
      <app-menu-status-badge [status]="row.status" [startAt]="row.startAt" [endAt]="row.endAt" [use12h]="use12h()" [locale]="locale()"/>
    }
  </ng-template>

  <ng-template listCellTemplate="hours" let-row>
    @let h = hours(row);
    <span class="text-sm text-slate-700 tabular-nums">
      @if (h.allDay) { {{ 'MENU_BUILDER.STATUS.ALL_DAY' | translate }} }
      @else { {{ h.range }}@if (h.overnight) { <span class="text-xs text-slate-500"> {{ 'MENU_BUILDER.STATUS.NEXT_DAY' | translate }}</span> } }
    </span>
  </ng-template>

  <ng-template listCellTemplate="availableOnline" let-row>
    <span class="inline-block w-2.5 h-2.5 rounded-full" [class.bg-emerald-500]="row.availableOnline" [class.bg-slate-300]="!row.availableOnline"></span>
  </ng-template>

  <ng-template listRowActions let-row>
    <div class="inline-flex items-center justify-end gap-2" (click)="$event.stopPropagation()">
      <button type="button" (click)="edit(row); $event.stopPropagation()"
        class="opacity-0 group-hover:opacity-100 focus-visible:opacity-100 [@media(hover:none)]:opacity-100 transition-opacity px-4 h-9 inline-flex items-center rounded-full bg-brand-600 text-white text-sm font-medium shadow-sm hover:bg-brand-700">
        {{ 'COMMON.EDIT' | translate }}
      </button>
    </div>
  </ng-template>
</app-list-page>
