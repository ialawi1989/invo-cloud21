<div class="mbf-page">
  <header class="mbf-header">
    <app-breadcrumbs [items]="breadcrumbs()" separator="chevron"/>
    <div class="mbf-titlebar">
      <h1 class="mbf-title">{{ store.menu().id ? store.menu().name : ('MENU_BUILDER.NEW_MENU' | translate) }}</h1>
    </div>
  </header>

  @if (store.errors()['_general']; as general) {
    <p class="mbf-general-error" role="alert">{{ general }}</p>
  }

  @if (store.loading()) {
    <app-form-skeleton/>
  } @else {
    <app-menu-details-card
      [menu]="store.menu()" [priceLabels]="priceLabels()" [branches]="branches()" [errors]="store.errors()"
      (patch)="onDetails($event)"/>

    <div class="mbf-body">
      <app-section-list
        [sections]="sectionRows()" [selectedId]="store.selectedSectionId()" [errors]="sectionErrors()" [emptyCount]="store.emptySectionCount()"
        (select)="store.select($event)" (add)="addSection()" (reorder)="onSectionReorder($event)" (action)="onSectionAction($event)"/>

      @if (store.selectedSection(); as s) {
        <app-section-editor
          [section]="s" [page]="store.selectedPage()" [products]="store.pageProducts()" [slotsUsed]="store.slotsUsed()"
          [canAddPage]="store.canAddPage()" [nameError]="selectedNameError()" [results]="results()" [searching]="searching()"
          [notice]="notice()" [renameRequest]="renameRequest()"
          (rename)="onRename($event)" (productColors)="onProductColors()" (selectPage)="store.selectPage($event)" (addPage)="store.addPage()"
          (removePage)="onRemovePage($event)" (query)="onQuery($event)" (pickResult)="onPickResult($event)" (pickAt)="onPickAt($event)"
          (tileMove)="onTileMove($event)" (tileResize)="onTileResize($event)" (tileStep)="onTileStep($event)"
          (tileRemove)="onTileRemove($event)" (tileColor)="onTileColor($event)" (productDrop)="onProductDrop($event)"/>
      } @else {
        <p class="mbf-pick">{{ 'MENU_BUILDER.NO_SECTIONS' | translate }}</p>
      }
    </div>
  }

  <app-sticky-save-bar [dirty]="store.isDirty()" [saving]="store.saving()" (cancel)="cancel()" (save)="save()"/>
  <app-loading-overlay [show]="store.saving()" [message]="'COMMON.SAVING' | translate"/>
</div>
