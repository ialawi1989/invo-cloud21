<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Invo Admin</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('invo.theme');
      if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('app-dark');
    } catch (e) {}
    // Table density: last known value, so the first paint already has the right row height (the account's value replaces it once loaded).
    try { document.documentElement.setAttribute('data-density', localStorage.getItem('invo.density') === 'compact' ? 'compact' : 'comfortable'); } catch (e) { document.documentElement.setAttribute('data-density', 'comfortable'); }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
