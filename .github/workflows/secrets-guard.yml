name: secrets guard

# The hook is per-developer and bypassable with --no-verify. This is the copy
# that cannot be skipped, and it scans every tracked file rather than only the
# diff, so anything that slipped in before the guard existed still surfaces.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scan tracked files for credentials and env files
        run: |
          chmod +x scripts/check-secrets.sh
          ./scripts/check-secrets.sh --all
