<div class="cg4 product mb-4">

  <!-- Full-bleed image -->
  <app-lazy-image
    class="cg4-img"
    src="{{(product.mediaUrl?.defaultUrl || product.mediaUrl) + '?width=400' || 'assets/images/default-blank-image.png' }}"
    alt=" "
    width="100%"
    height="100%"
    [objectFit]="template?.settings?.product_image_size || 'cover'"
    borderRadius="0" />

  <!-- Sale badge -->
  @if(product.discountAmount) {
    <span class="cg4-sale">{{"Sale!" | translate}}</span>
  }

  <!-- Wishlist -->
  <button
    class="cg4-wish"
    (click)="addItemToWishlist(product)"
    [class.active]="isInWishList(product.id)"
    [attr.aria-label]="'Wishlist' | translate">
    {{ isInWishList(product.id) ? '♥' : '♡' }}
  </button>

  <!-- Invisible click overlay for navigation -->
  <a href="javascript:void(0);" class="cg4-nav-overlay" (click)="gotoProductPage(product)"></a>

  <!-- Frosted glass info panel -->
  <div class="cg4-glass">
    <div class="cg4-info">
      <span class="cg4-name">
        {{ appService.lang === 'ar'
            ? (product.translation?.name?.ar || product.name)
            : product.name }}
      </span>
      <div class="cg4-price-row">
        <app-product-price
          [product]="product"
          [currentCurrency]="currentCurrency"
          [companyData]="companyData">
        </app-product-price>
      </div>
    </div>

    @if(!appService.viewOnly) {
      @if(product.showAddCartButton()) {
        <button class="cg4-btn"
          (click)="addItemToCart({ productId: product.id, qty: 1, showCart: true }); $event.stopPropagation()">
          {{"Add to cart" | translate}}
        </button>
      }
      @if(product.showViewOptionButton()) {
        <button class="cg4-btn" (click)="gotoProductPage(product); $event.stopPropagation()">
          {{"View Product" | translate}}
        </button>
      }
      @if(product.showOutOfStockButton()) {
        <button class="cg4-btn dis" disabled>
          {{"Out of stock" | translate}}
        </button>
      }
    }
  </div>

</div>
