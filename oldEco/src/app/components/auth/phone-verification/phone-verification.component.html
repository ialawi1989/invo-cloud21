<div class="lp-modal-close" (click)="activeModal.dismiss('')">
  <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
    <path d="M1 1L13 13M13 1L1 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
</div>

<div class="lp-wrap">

  <div class="lp-brand">
    <div class="lp-brand-dot"></div>
    <span class="lp-brand-name">invo</span>
  </div>

  <div class="lp-otp-icon">
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
      <rect x="6" y="4" width="16" height="20" rx="3" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10 14h8M10 18h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="14" cy="9" r="1.5" fill="currentColor"/>
    </svg>
  </div>

  <h2 class="lp-title">{{"Phone Verification" | translate}}</h2>
  <p class="lp-subtitle">{{"Enter the 6-digit code we sent" | translate}}</p>

  <div class="lp-form">
    <div class="lp-field">
      <label class="lp-label">{{"OTP" | translate}}</label>
      <input type="text" class="lp-input lp-input--otp" maxlength="6" placeholder="——————" [(ngModel)]="verificationData.otp" />
    </div>
  </div>

  <button class="lp-btn-primary" (click)="verifyStep2()">
    {{"Verify" | translate}}
  </button>

  <div class="lp-otp-actions">
    <a href="javascript:void(0);" class="lp-link" [class.lp-link--muted]="!!otpTimer" (click)="resend()">
      {{"Resend code" | translate}}
      @if(otpTimer){ <span class="lp-timer">({{otpTimer}})</span> }
    </a>
  </div>

</div>
