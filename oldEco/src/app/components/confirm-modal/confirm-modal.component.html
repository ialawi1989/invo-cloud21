<div class="newsletter-popup newsletter-pop1" id="confirm-modal-popup">
  <div class="newsletter-content">
    <h5 class="font-weight-semi-bold">{{ title | translate }}</h5>
    @if (subtitle) {
      <p class="text-grey">{{ subtitle | translate }}.</p>
    }
    <div class="confirm-modal-actions">
      <a class="btn btn-dark dark-btn pt-2 pb-2" (click)="cancel()">
        {{ cancelText | translate }}
      </a>
      <a class="btn btn-primary primary-btn pt-2 pb-2" (click)="confirm()">
        {{ confirmText | translate }}
      </a>
    </div>
  </div>
</div>
