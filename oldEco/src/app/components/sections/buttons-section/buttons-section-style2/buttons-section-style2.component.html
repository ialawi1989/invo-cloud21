<div class="section-content pt-8 pb-8 appear-animatee"
  [style.min-height]="section.sectionHeight == 'Full' ? 'calc(100vh - 95px)' : ''" [style.background]="getBackground()"
  [style.background-attachment]="section.sectionBackground.isParallax ? 'fixed' : ''"
  [style.background-size]="section.sectionBackground.style == 'Image' ? 'cover' : ''"
  [style.background-position]="section.sectionBackground.style == 'Image' ? 'center' : ''"
  [style.background-repeat]="section.sectionBackground.style == 'Image' ? 'no-repeat' : ''"
  [style.display]="section.sectionHeight == 'Full' ? 'flex' : ''"
  [style.flex-direction]="section.sectionHeight == 'Full' ? 'column' : ''"
  [style.justify-content]="section.sectionHeight == 'Full' ? 'center' : ''"
  [style.align-items]="section.sectionHeight == 'Full' ? 'center' : ''"
  [style.margin]="(section.marginVertical || 0) + 'px ' + (section.marginHorizontal || 0) + 'px'"
  [style.padding]="(section.paddingVertical || 0) + 'px ' + (section.paddingHorizontal || 0) + 'px'">
  @if(section != null && section.sectionBackground != null){
  <div class="section-overlay" [style.opacity]="section.sectionBackground.overlayOpacity / 100"
    [style.background-color]="section.sectionBackground.overlayColor || '#f9fafb'"></div>
  }
  <div class="section-text">
    <div [class]="themeBuilder?.layout?.width == 'Full' ? 'me-2 ms-2' : 'container'">
      <div class="group-service-btn-container">

        @if(invoiceData.serviceName == 'DineIn'){
        <div class="group-service-btn dinein-btn" [routerLink]="['/menu']"
          [queryParams]="{ branch_id: invoiceData.branchId, service_name:'DineIn', table_id:invoiceData.tableId}">
          <button>
            <div class="btn-container">
              <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-utensils w-6 h-6">
                  <path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"></path>
                  <path d="M7 2v20"></path>
                  <path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"></path>
                </svg>
              </div>
              <div class="text-container">
                <h3 class="text-lg font-semibold text-secondary-900">
                  <small>{{"Continue DineIn Order" | translate}}</small>
                </h3>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-right text-secondary-900">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </div>
          </button>
        </div>
        }

        @for (button of section.sectionData?.buttons; track $index) {
        @if (button.buttonLink) {
        <div class="group-service-btn" [style.border]="'1px solid ' + button.color">
          <button (click)="appService.gotoPage(button.buttonLink)">
            <div class="btn-container">
              <div class="icon" [style.background]="button.color+33">
                @if(button.title?.toLowerCase() == 'delivery' ){
                @if(appService.shippingType == 'shipping'){
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-truck w-6 h-6 text-blue-600" [attr.stroke]="button.color">
                  <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"></path>
                  <path d="M15 18H9"></path>
                  <path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"></path>
                  <circle cx="17" cy="18" r="2"></circle>
                  <circle cx="7" cy="18" r="2"></circle>
                </svg>
                }@else{
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-package w-6 h-6 text-indigo-600" [attr.stroke]="button.color">
                  <path d="m7.5 4.27 9 5.15"></path>
                  <path
                    d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z">
                  </path>
                  <path d="m3.3 7 8.7 5 8.7-5"></path>
                  <path d="M12 22V12"></path>
                </svg>
                }
                }@else{
                @if(button.title?.toLowerCase() == 'pickup' ){
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-user-check w-6 h-6 text-green-600" [attr.stroke]="button.color">
                  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                  <circle cx="9" cy="7" r="4"></circle>
                  <polyline points="16 11 18 13 22 9"></polyline>
                </svg>
                }@else{
                @if(button.title?.toLowerCase() == 'table reservation' ){
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-calendar w-6 h-6 text-purple-600" [attr.stroke]="button.color">
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                  <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                  <path d="M3 10h18"></path>
                </svg>
                }@else{
                @if(button.title?.toLowerCase() == 'shop' ){
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-shopping-bag w-6 h-6 text-orange-600" [attr.stroke]="button.color">
                  <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
                  <path d="M3 6h18"></path>
                  <path d="M16 10a4 4 0 0 1-8 0"></path>
                </svg>
                }@else{
                @if(button.title?.toLowerCase() == 'appointments' ){
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                  class="lucide lucide-calendar-check w-6 h-6 text-teal-600" [attr.stroke]="button.color">
                  <path d="M8 2v4"></path>
                  <path d="M16 2v4"></path>
                  <rect width="18" height="18" x="3" y="4" rx="2"></rect>
                  <path d="M3 10h18"></path>
                  <path d="m9 16 2 2 4-4"></path>
                </svg>
                }@else{
                <img onerror="this.src = 'assets/images/default-blank-image.png'" src="{{button.image.defaultUrl}}"
                  style="height:24px; object-fit: contain;">
                }
                }
                }
                }
                }
              </div>
              <div class="text-container">

                <h3 class="text-lg font-semibold text-gray-900" [style.color]="button.color">
                  <small>
                    @if(button.title?.toLowerCase() == 'delivery' ){
                    @if(appService.shippingType == 'shipping'){
                    {{"Shipping" | translate}}
                    }@else {
                    {{ (appService.lang == 'ar' ? button.translation?.ar?.title ? button.translation?.ar?.title :
                    button.title : button.title) | translate}}
                    }
                    }@else{
                    {{ (appService.lang == 'ar' ? button.translation?.ar?.title ? button.translation?.ar?.title :
                    button.title : button.title) | translate}}
                    }
                  </small>
                </h3>
                <p class="text-sm text-gray-500" [style.color]="button.color">
                  <small>
                    @if(appService.shippingType != 'shipping'){
                    @if(button.subtitle){
                    {{ (appService.lang == 'ar' ? button.translation?.ar?.subtitle ? button.translation?.ar?.subtitle :
                    button.subtitle : button.subtitle) | translate}}
                    }
                    }
                  </small>
                </p>
              </div>
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-arrow-right" [style.color]="button.color">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
              </svg>
            </div>
          </button>
        </div>
        }
        }
      </div>
    </div>
  </div>
</div>
