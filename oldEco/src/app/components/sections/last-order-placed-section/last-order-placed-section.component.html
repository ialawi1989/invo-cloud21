@if(lastOrderData?.sessionId){
<div class="alert alert-light alert-primary pb-2 pt-2">
  <div class="container">
    <div class="text-center clickable" (click)="onViewLastOrderClick()" [routerLink]="['/order', lastOrderData.sessionId]">
      <b>
        {{"Click here to view your last order" | translate}}
      </b>
    </div>
  </div>
</div>
}
