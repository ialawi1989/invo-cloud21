<div class="compare-button-wrapper">
  <button class="btn btn-outline-secondary btn-sm compare-btn" [class.active]="isInCompare"
    [class.disabled]="isCompareFull && !isInCompare" [disabled]="isLoading" (click)="toggleCompare()"
    [title]="getButtonTitle()">
    @if(!isLoading){
    <i class="fas fa-balance-scale"></i>

    }
    @if(isLoading){
    <i class="fas fa-spinner fa-spin"></i>

    }

    <span class="btn-text d-none d-sm-inline ms-1">
      {{ isInCompare ? ('Remove from Compare' | translate) : ('Add to Compare' | translate) }}
    </span>
  </button>
  @if(compareCount > 0 && !isInCompare){
  <!-- Compare count badge -->
  <div class="compare-count-badge">
    <span class="badge bg-primary">{{ compareCount }}</span>
  </div>
  }

  <!-- Go to Compare link -->
  <a class="btn btn-primary btn-sm ms-2 compare-view-btn" routerLink="/compare" *ngIf="compareCount > 1"
    [title]="'View Compare (' + compareCount + ' items)' | translate">
    <i class="fas fa-eye"></i>
    <span class="d-none d-sm-inline ms-1">{{ 'Compare' | translate }} ({{ compareCount }})</span>
  </a>
</div>
