<div class="fb-modal-wrapper">

  <!-- Header -->
  <div class="fb-modal-header">
    <div class="fb-modal-header-inner">
      <div class="fb-modal-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
      </div>
      <h2 class="fb-modal-title"></h2>
    </div>
    <button type="button" class="fb-modal-close clickable" aria-label="Close" (click)="cancel()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>

  <!-- Body -->
  <div class="fb-modal-body">
    <app-feedback-compo [feedbackData]="feedbackData"></app-feedback-compo>
  </div>

</div>
