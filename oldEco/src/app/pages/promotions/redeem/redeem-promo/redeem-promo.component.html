<div class="redeem-container pt-5 mb-4">

  <p class="label">{{ 'PROMOTIONS.COUPON.ENTER_PROMO' | translate }}</p>

  <!-- 
  <select (change)="onSelectCoupon($event)" id="couponList">
    <option value="">-- Select a coupon --</option>
    <option *ngFor="let c of coupons" [value]="c.code">
      {{ c.code }}
    </option>
  </select> -->

  <input type="text" [(ngModel)]="promoCode" placeholder="{{'PROMOTIONS.COUPON.ENTER_CODE_HERE' | translate }} "
    list="couponList" [disabled]="!!appliedCouponId" />
  <datalist id="couponList">
    <option *ngFor="let c of coupons" [value]="c.code">
      {{ c.code }}
      @if(isDiscountSet(c.couponSet)) {
      <span>
        ({{ 'PROMOTIONS.COUPON.PERCENT_OFF' | translate:{percentage: c.couponSet.percentage} }})
      </span>}

      @if(isProductSet(c.couponSet)) {
      ( <div class="discount" [ngClass]="{
         'text-right': appService.lang === 'ar',
         'text-left': appService.lang !== 'ar'
       }" [dir]="appService.lang === 'ar' ? 'rtl' : 'ltr'">



        @if (c.couponSet.products!.percentage === 100) {
        {{ 'Free' }}
        } @else {
         ({{ 'PROMOTIONS.COUPON.PERCENT_OFF' | translate:{percentage: c.couponSet.products!.percentage} }})
        }

        {{ c.couponSet.products!.productsInfo?.name ? translate(c.couponSet.products!.productsInfo!.name,
        appService.lang) : 'Unknown Product' }}





      </div>)
      }
    </option>
  </datalist>



  @if(!appliedCouponId){
  <button (click)="redeemPromo()" [disabled]="!promoCode">
    {{ 'PROMOTIONS.COUPON.REDEEM_BUTTON' | translate }}
  </button>
  }

  @if(appliedCouponId){
  <button (click)="unRedeemPromo()">
    {{ 'PROMOTIONS.COUPON.CLEAR' | translate }}
  </button>
  }
</div>
