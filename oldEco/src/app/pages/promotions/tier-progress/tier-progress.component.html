<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tier Progress</title>

  <link rel="stylesheet">
</head>
<body>

<main style="padding:1.25rem;">
  <section class="tier-card">

    <div class="tier-header">
      <span class="icon-target">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none">
          <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.5"/>
          <path d="M12 3v3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </span>
      <h3>Progress to <span id="nextTierName">Gold</span></h3>
    </div>

    <div class="tier-body">

      <!-- Spending -->
      <div class="progress-block">
        <div class="progress-row">
          <span>Total Spending</span>
          <strong id="spentText">$420 / $600</strong>
        </div>

        <div class="progress-shell">
          <div class="progress-fill blue" style="width:70%;"></div>
        </div>

        <p id="spentHelper" class="helper">Spend $180 more to reach Gold</p>
      </div>

      <!-- Purchases -->
      <div class="progress-block">
        <div class="progress-row">
          <span>Total Purchases</span>
          <strong id="purchasesText">3 / 5</strong>
        </div>

        <div class="progress-shell">
          <div class="progress-fill green" style="width:60%;"></div>
        </div>

        <p id="purchasesHelper" class="helper">Make 2 more purchases to reach Gold</p>
      </div>

      <!-- Success message (hidden in this case) -->
      <div id="successBox" class="success" style="display:none">
        🎉 Congratulations! You've qualified for <span id="congratsTier">Gold</span> tier!
      </div>

    </div>
  </section>
</main>

</body>
</html>
