@if (showServiceRequest) {
<div class="mfp-bg mfp-newsletter mfp-flip-popup mfp-ready" (click)="closePop()"></div>
<div class="mfp-wrap mfp-close-btn-in mfp-auto-cursor mfp-newsletter mfp-flip-popup mfp-ready" tabindex="-1">
  <div class="mfp-container mfp-s-ready mfp-inline-holder">
    <div class="mfp-content">
      <div class="page-popup newsletter-pop1">
        <div class="newsletter-content text-center ">
          <app-service-request-compo [showContainer]="false"></app-service-request-compo>
        </div>
        <button type="button" class="mfp-close" (click)="closePop()"><span>×</span></button>
      </div>
    </div>
  </div>
</div>
}
